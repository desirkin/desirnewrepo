<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpent</title>
<!-- UI-1: iPhone standalone presentation — installable, no URL-bar hacks -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serpent">
<meta name="theme-color" content="#030612">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* ============ deep space ============ */
  :root {
    --bg: #030612;
    --ink: #cfe3ea;
    --dim: #5c6b7a;
    --accent: #59e6c6;
    --accent2: #69d2ff;
    --vig: rgba(20, 60, 80, .22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    transition: background 1.2s ease;
  }
  /* posture = temperature */
  body[data-posture="STALKING"]  { --accent:#ffb454; --accent2:#ffd28a; --vig:rgba(255,150,40,.16); }
  body[data-posture="STRIKE"]    { --accent:#ff5b3c; --accent2:#ffa06b; --vig:rgba(255,70,40,.30); }
  body[data-posture="DIGESTING"] { --accent:#ff9e64; --accent2:#ffc99b; --vig:rgba(255,140,80,.12); }
  body[data-posture="RETREAT"]   { --accent:#8a94a6; --accent2:#a9b2c0; --vig:rgba(30,34,46,.45); }
  body[data-posture="RETREAT"] #scene { filter: saturate(.4) brightness(.82); }
  #scene { transition: filter 1.4s ease; }

  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 18vmax var(--vig);
    transition: box-shadow 1.4s ease;
  }
  #flash { position: fixed; inset: 0; background: #ff5b3c; opacity: 0; pointer-events: none; }
  #flash.hit { animation: flash .55s ease-out; }
  @keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }

  /* ============ core ============ */
  #scene { position: fixed; inset: 0; }
  /* UI-1A §14: the freed top space feeds the hunting field — larger, and
     balanced a touch higher so the dead zone above the controls shrinks */
  /* UI-1B2 §9: the whole hunting composition sits lower — capsules breathe,
     the animal is centered, the dead zone above the controls shrinks */
  #core {
    position: absolute; left: 50%; top: 48%;
    width: min(96vmin, 400px); height: min(96vmin, 400px);
    transform: translate(-50%, -50%);
  }
  /* UI-1: breathing is state-reactive — slowest at rest, tighter while
     stalking, quieted when caged, dormant under KILL. Real state only. */
  #ringGroup { animation: breathe var(--breath, 8s) ease-in-out infinite; transform-origin: center; }
  body[data-posture="STALKING"] { --breath: 4.6s; }
  body.caged { --breath: 13s; }
  body.caged #scene { filter: saturate(.62) brightness(.86); }
  body.killed #scene { filter: saturate(.22) brightness(.68); }
  body.killed #ringGroup, body.killed .ringPulse { animation: none; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  /* UI-1A/UI-1C2: the coil is a BODY — dark, heavy, rim-lit. The mass is
     near-black scale green; posture temperature survives in the rim glow
     and the lit flank (color-mix override, with a plain fallback first). */
  .cg1 { stop-color: var(--accent2); stop-opacity: .9; }
  .cg2 { stop-color: var(--accent); stop-opacity: .9; }
  .cg2 { stop-color: color-mix(in srgb, var(--accent) 38%, #08130e); stop-opacity: .97; }
  .cg3 { stop-color: var(--accent); stop-opacity: .55; }
  .cg3 { stop-color: color-mix(in srgb, var(--accent) 14%, #050d09); stop-opacity: .97; }
  .coilFill { fill: url(#coilGrad); filter: drop-shadow(0 0 9px var(--accent)); }
  /* UI-1C6: the WHOLE animal is the concept artwork — one flesh, band and
     skull. A soft dark halo seats it; the vector band beneath bleeds the
     posture-temperature glow around its edges. */
  #coilHead { filter: drop-shadow(0 0 10px rgba(6, 26, 20, .85)); }
  /* the sight-line of the hunt: head -> the coin being checked. Marching
     dashes toward the prey; calm when reduced; gone under KILL. */
  #gaze { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
  #gazeLine { stroke: #ff6b52; stroke-width: 1.4; stroke-linecap: round;
              stroke-dasharray: 4 9; opacity: 0; transition: opacity .8s ease; }
  #gaze.on #gazeLine { opacity: .42; }
  body:not(.reduced) #gaze.on #gazeLine { animation: gazeMarch 1.1s linear infinite; }
  @keyframes gazeMarch { to { stroke-dashoffset: -13; } }
  body.killed #gazeLine { opacity: 0; }
  #coilCasing { fill: none; stroke: var(--bg); stroke-linecap: round; opacity: .92; }
  #coilHighlight { fill: none; stroke: #eafffa; stroke-width: 1.4; opacity: .3; stroke-linecap: round; }
  /* segment hint across the wider body + a slow highlight moving through —
     muscle and scale, not sci-fi wire. */
  .ringScales { fill: none; stroke: var(--bg); stroke-width: 4.6; opacity: .14;
                stroke-dasharray: 2.6 7.4; }
  /* UI-1C: faint concentric orbit guides — the field reads as a system */
  .orbitGuide { fill: none; stroke: #1d2b40; stroke-width: .8; opacity: .55; }
  .orbitGuide.dashed { stroke-dasharray: 1.6 6; opacity: .45; }
  .ringPulse  { fill: none; stroke: var(--accent2); stroke-width: 2.4; opacity: .38;
                stroke-dasharray: 46 607; stroke-linecap: round;
                filter: blur(1.1px) drop-shadow(0 0 5px var(--accent2));
                transform-origin: center; transition: stroke 1.2s ease; }
  body:not(.reduced) .ringPulse { animation: coilPulse 26s linear infinite; }
  @keyframes coilPulse { to { transform: rotate(360deg); } }
  .arcBase { fill: none; stroke: #2a3547; stroke-width: 2; opacity: .55; }
  .arcFill { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round;
             filter: drop-shadow(0 0 4px var(--accent)); transition: stroke 1.2s ease; }
  .tick    { stroke: #62718a; stroke-width: 2; }
  .tick.hot { stroke: #ff7a5c; }
  .sess    { fill: none; stroke: #35435c; stroke-width: 1; opacity: .6; }
  .sessFill{ fill: none; stroke: var(--accent2); stroke-width: 1.4; stroke-linecap: round; opacity: .7;
             transition: stroke 1.2s ease; }
  /* UI-1B2/UI-1C: the outer serpent presence — the hood of something huge
     framing the top of the field, with two slit-pupil reddish eyes. Louder
     than before (the concept frame), still framing and never the subject. */
  #lurk { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .lurkShade { position: absolute; left: 0; right: 0; top: 0; height: 38vh;
    background:
      radial-gradient(62% 150% at 4% -28%, rgba(4, 20, 16, .98), rgba(5, 16, 13, .55) 52%, transparent 72%),
      radial-gradient(62% 150% at 96% -28%, rgba(4, 20, 16, .98), rgba(5, 16, 13, .55) 52%, transparent 72%),
      radial-gradient(95% 65% at 50% -32%, rgba(3, 12, 12, .88), transparent 78%); }
  /* UI-1C2: the eyes up top are BIG — glaring hooded almonds, outer corners
     raised, burning iris under a dark scale brow. Still decoration, still
     dimmed under KILL, never over the working field. */
  .lurkEye { position: absolute; top: 8.5vh;
    width: clamp(84px, 23vw, 150px); height: clamp(28px, 7.6vw, 50px); border-radius: 50%;
    background: radial-gradient(ellipse at 50% 58%, #ffd0a6 0%, #ff8a4a 20%, #d63c1e 46%, #6e1206 70%, transparent 84%);
    filter: drop-shadow(0 0 26px rgba(255, 70, 30, .5)); opacity: .58; }
  .lurkEye::before { content: ''; position: absolute; left: -10%; right: -10%; top: -58%; height: 112%;
    background: radial-gradient(55% 95% at 50% 8%, rgba(4, 15, 12, .98), rgba(4, 15, 12, .72) 55%, transparent 80%);
    border-radius: 50%; } /* the hooded brow */
  .lurkEye::after { content: ''; position: absolute; left: 50%; top: 52%; width: 8%; height: 84%;
    transform: translate(-50%, -50%); background: #070202; border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(0, 0, 0, .8); } /* the slit pupil */
  .lurkEye.left { left: 5%; transform: rotate(9deg); }
  .lurkEye.right { right: 5%; transform: rotate(-9deg); }
  body:not(.reduced) .lurkEye { animation: lurkGlow 9s ease-in-out infinite; }
  @keyframes lurkGlow { 50% { opacity: .34; } }
  body.killed .lurkEye { opacity: .12; animation: none; }
  /* UI-1C: the nameplate — between the capsules and the eyes */
  #brand { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 52px);
    left: 0; right: 0; text-align: center; z-index: 2; pointer-events: none; }
  #brand .b1 { font-size: 15px; font-weight: 600; letter-spacing: .52em; text-indent: .52em;
    color: var(--ink); text-shadow: 0 0 12px rgba(89, 230, 198, .35); }
  #brand .b1::before, #brand .b1::after { content: '—'; letter-spacing: 0; text-indent: 0;
    color: var(--dim); opacity: .7; margin: 0 10px; }
  #brand .b2 { margin-top: 3px; font-size: 8px; letter-spacing: .46em; text-indent: .46em;
    color: var(--dim); }

  /* ============ verdict ============ */
  #verdict {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
    text-align: center; width: 78vw; pointer-events: auto; cursor: default;
  }
  /* UI-1A §13: ~15% smaller — the animal and its prey carry the story */
  #verdict .word {
    font-size: clamp(22px, 7.1vw, 36px); font-weight: 700; letter-spacing: .14em;
    color: var(--accent); text-shadow: 0 0 16px var(--accent), 0 0 2px var(--accent);
    transition: color 1.2s ease, text-shadow 1.2s ease;
  }
  #verdict .sub {
    margin-top: 6px; font-size: clamp(12px, 3.4vw, 15px); letter-spacing: .3em;
    color: var(--ink); opacity: .85;
  }
  #verdict .why {
    margin-top: 8px; font-size: 11px; letter-spacing: .12em; color: var(--dim);
    text-transform: uppercase;
  }
  #verdict .orn { margin-top: 7px; font-size: 9px; color: var(--accent); opacity: .65;
                  transition: color 1.2s ease; }

  /* ============ planets ============ */
  .planet { position: absolute; left: 0; top: 0; width: 46px; height: 58px;
            margin: -23px 0 0 -23px; text-align: center; cursor: pointer; will-change: transform; }
  .planet .body {
    width: 30px; height: 30px; border-radius: 50%; margin: 0 auto;
    opacity: .82; transition: opacity .6s, box-shadow .6s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset -3px -4px 8px rgba(0, 0, 0, .35);
  }
  /* UI-1C: the coin badge glyph — presentation only, drawn from the symbol */
  .planet .glyph { font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, .94);
                   text-shadow: 0 1px 3px rgba(0, 0, 0, .6); pointer-events: none; }
  .planet.focal .glyph { font-size: 17px; }
  .planet.quiet .glyph { font-size: 10px; opacity: .8; }
  /* UI-1C: the comet trail — orbit direction made visible; decoration only */
  .planet .trail { position: absolute; left: 50%; top: 15px; width: 54px; height: 3px;
    transform-origin: 100% 50%; pointer-events: none; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent2)); opacity: .34; filter: blur(1px); }
  .planet.quiet .trail { opacity: .14; }
  body.reduced .trail { visibility: hidden; }
  .planet .lbl { margin-top: 5px; font-size: 10px; letter-spacing: .22em; color: var(--dim); }
  .planet.stalked .body { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  .planet.stalked .lbl { color: #ffb454; }
  /* UI-1: the CURRENT FOCUS — prey closest to the animal, larger and
     sharper, never covering the cobra. The animal stays the center. */
  .planet .body { transition: opacity .6s, box-shadow .6s, width .8s ease, height .8s ease; }
  .planet .lbl { will-change: transform; }
  /* §11: the current focus is unmistakable — closest, bigger, ringed, named */
  .planet.focal .body { width: 40px; height: 40px; opacity: 1;
                        box-shadow: 0 0 0 2px rgba(89,230,198,.55), 0 0 20px 5px rgba(89,230,198,.30); }
  .planet.focal .lbl { color: #eafffa; font-weight: 700; letter-spacing: .26em; font-size: 11px;
                       text-shadow: 0 0 8px rgba(89,230,198,.8); }
  /* quiet fallback majors: present, but clearly NOT current prey */
  .planet.quiet .body { width: 24px; height: 24px; opacity: .5; }
  .planet.quiet .lbl { opacity: .55; font-size: 9px; }
  /* real RUMINT nomination: a quiet amber dot, distinct from demo's full treatment */
  .planet .nomdot { display: none; width: 6px; height: 6px; border-radius: 50%;
                    background: #ffb454; box-shadow: 0 0 7px #ffb454; margin: 3px auto 0; }
  .planet.nominated .nomdot { display: block; }
  .planet.nominated .lbl { color: #ffb454; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 10px 1px rgba(255,180,84,.55); }
    50%     { box-shadow: 0 0 22px 6px rgba(255,180,84,.85); }
  }
  .reticle {
    position: absolute; left: 50%; top: 15px; width: 54px; height: 54px;
    transform: translate(-50%, -50%); display: none; pointer-events: none;
  }
  .planet.stalked .reticle { display: block; }
  body:not(.reduced) .planet.stalked .reticle { animation: retSpin 14s linear infinite; }
  @keyframes retSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ============ chips & chrome ============ */
  .chip {
    position: fixed; font-size: 11px; letter-spacing: .14em; color: var(--ink);
    background: rgba(8, 14, 28, .68); border: 1px solid #223048; border-radius: 20px;
    padding: 6px 12px; backdrop-filter: blur(4px); z-index: 30;
  }
  /* UI-1A: top capsule family — three small real controls, no dead pills */
  #capsules { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 52px;
              display: flex; gap: 8px; z-index: 30; }
  .capsule { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
             font-family: inherit; background: rgba(8,14,28,.62); border: 1px solid #223048; border-radius: 12px;
             padding: 6px 10px; color: var(--ink); cursor: pointer; backdrop-filter: blur(4px);
             text-align: left; transition: border-color .6s; }
  .capsule .ck { font-size: 8px; letter-spacing: .26em; color: var(--dim); }
  .capsule .ck::after { content: ' ›'; letter-spacing: 0; opacity: .7; }
  .capsule .cv { font-size: 10px; letter-spacing: .05em; font-variant-numeric: tabular-nums;
                 white-space: nowrap; max-width: 100%; }
  .capsule.off .cv { color: var(--dim); }
  .capsule.hot { border-color: #7a5526; } /* faint amber edge — e.g. EARS with HYPED, never a casino */
  body.demo #capsules { display: none; }

  /* UI-1A: the ONE bottom operational strip — freshness + clock + session */
  #clockchip { bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
               color: var(--dim); white-space: nowrap; display: flex; gap: 7px; align-items: center; }
  #stripdot { width: 7px; height: 7px; border-radius: 50%; background: #56607a; flex: none; }
  #stripdot.LIVE { background: #3aa981; box-shadow: 0 0 8px #3aa981; }
  #stripdot.STALE, #stripdot.DEGRADED { background: #ffb454; box-shadow: 0 0 8px #ffb454; }
  /* UI-1C: heartbeat glyph — visible only while the tape is genuinely LIVE
     (renderStrip toggles it from the same freshness truth as the dot) */
  #pulse { flex: none; display: none; }
  #clockchip.live #pulse { display: block; }
  #pulse path { fill: none; stroke: #3aa981; stroke-width: 1.4; stroke-linecap: round; opacity: .6; }
  body:not(.reduced) #clockchip.live #pulse path {
    stroke-dasharray: 12 52; animation: pulseRun 2.6s linear infinite; }
  @keyframes pulseRun { to { stroke-dashoffset: -64; } }

  /* human controls: confirm-tap buttons. They only remove permission to trade. */
  #controls { position: fixed; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 40px);
              left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 35; }
  body.demo #controls { display: none; }
  #controls button {
    font-size: 11px; font-weight: 700; letter-spacing: .2em; padding: 9px 15px;
    border-radius: 20px; cursor: pointer; background: rgba(8,14,28,.75);
    backdrop-filter: blur(4px); transition: all .2s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  #controls button svg { flex: none; opacity: .9; }
  #btnKill  { color: #ff6b52; border: 1px solid #7c2f22; }
  #btnCage  { color: #ffb454; border: 1px solid #7a5526; }
  #btnVeto  { color: #69d2ff; border: 1px solid #2a5a78; }
  #btnClear { color: #9fb4c8; border: 1px solid #3a4a62; }
  #btnLedger { color: #7fc7de; border: 1px solid #2c4a5c; } /* neutral slate-cyan: display, not danger */
  #controls button.armed { color: #06090f; }
  #btnKill.armed  { background: #ff6b52; box-shadow: 0 0 16px rgba(255,107,82,.7); }
  #btnCage.armed  { background: #ffb454; box-shadow: 0 0 16px rgba(255,180,84,.7); }
  #btnClear.armed { background: #9fb4c8; }
  #controls button[hidden] { display: none; }
  #card .vrow { display: flex; justify-content: space-between; align-items: center;
                padding: 8px 4px; border-bottom: 1px solid #1c2942; font-size: 12px; }
  #card .vrow button { font-size: 10px; letter-spacing: .16em; padding: 5px 10px; border-radius: 14px;
                       color: #69d2ff; border: 1px solid #2a5a78; background: transparent; cursor: pointer; }
  #card .vrow button.armed { background: #69d2ff; color: #06090f; }
  /* reduced motion: decoration stops, information stays (system preference
     drives this — no permanent cockpit button needed) */
  body.reduced #ringGroup, body.reduced .planet.stalked .body { animation: none; }

  /* UI-1: tiny auth indicator (browser-side state only; server is the
     boundary). No giant pill over the serpent. */
  #authdot { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 40;
             width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
             background: rgba(8,14,28,.68); border: 1px solid #223048; color: var(--dim); cursor: pointer; }
  #authdot.authed { color: var(--accent); border-color: rgba(89,230,198,.55); }
  #authdot.warn { color: #ffb454; border-color: #7a5526; }
  body:not(.reduced) #authdot.warn { animation: authPulse 2.2s ease-in-out infinite; }
  @keyframes authPulse { 50% { box-shadow: 0 0 12px rgba(255,180,84,.6); } }
  #authwarn { top: calc(max(10px, env(safe-area-inset-top)) + 40px); right: 12px; left: auto; color: #ffb454;
              border-color: #7a5526; display: none; font-size: 9px; max-width: 46vw; text-align: right; }
  #authwarn.show { display: block; }

  /* UI-1: prey drawer sections + hunt drawer rows (all text set via
     textContent — external/social strings are DATA, never HTML) */
  #card h3.sec { margin-top: 13px; font-size: 10px; letter-spacing: .3em; color: var(--dim);
                 border-bottom: 1px solid #1c2942; padding-bottom: 4px; font-weight: 600; }
  #card .obs { font-size: 11.5px; color: var(--ink); padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
  #card .obs .m { color: var(--dim); flex: none; letter-spacing: .08em; }
  #card .obs .v { margin-left: auto; font-variant-numeric: tabular-nums; text-align: right; }
  #card .quiet { font-size: 11px; color: var(--dim); letter-spacing: .14em; padding: 6px 0; }
  #card .tierline { font-size: 12px; color: var(--accent); letter-spacing: .1em; padding: 5px 0; }

  /* UI-1: ledger performance console */
  #ledger .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  #ledger .kcard { border: 1px solid #22334c; border-radius: 10px; padding: 8px 10px; background: rgba(12,20,36,.5); }
  #ledger .kcard .k { font-size: 9px; letter-spacing: .22em; color: var(--dim); }
  #ledger .kcard .v { margin-top: 3px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #ledger .kcard .v small { font-size: 10px; font-weight: 400; color: var(--dim); }
  #ledger .reasons { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #ledger .reasons div { font-size: 9px; letter-spacing: .12em; padding: 3px 8px; border-radius: 10px;
                         border: 1px solid #22334c; color: var(--dim); }
  #ledger .trow { cursor: pointer; flex-wrap: wrap; }
  #ledger .trow .detail { flex-basis: 100%; color: var(--dim); font-size: 9.5px; letter-spacing: .06em;
                          padding-top: 3px; white-space: normal; }

  #demobadge {
    display: none; position: fixed; top: 46px; right: -34px; z-index: 50; cursor: pointer;
    transform: rotate(35deg); background: #b8860b; color: #0a0a05;
    font-size: 12px; font-weight: 700; letter-spacing: .28em; padding: 5px 44px;
    box-shadow: 0 0 14px rgba(255, 200, 60, .5);
  }
  body.demo #demobadge { display: block; }

  /* ============ shared drawer shell (UI-1B) ============
     Two answers at all times: WHAT AM I LOOKING AT (the sticky identity
     header) and HOW DO I GET OUT (permanent 44px Close + backdrop +
     Escape + Back). The header never scrolls away; the body scrolls
     inside a phone-bounded sheet. */
  #backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(1, 3, 10, .45); }
  #backdrop[hidden] { display: none; }
  .dhead { flex: none; display: flex; align-items: center; justify-content: space-between;
           gap: 10px; padding: 10px 12px 8px 18px; border-bottom: 1px solid #1c2942;
           touch-action: none; /* the header is also the swipe-down handle */ }
  .dtitle { min-width: 0; }
  .dtitle .kicker { display: block; font-size: 9px; letter-spacing: .3em; color: var(--dim); }
  .dhead h2 { font-size: 15px; letter-spacing: .3em; color: var(--accent); margin-top: 2px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the selected coin ticker is UNMISSABLE — larger than any section head */
  #card.coin .dhead h2 { font-size: 26px; letter-spacing: .18em; }
  .dclose { flex: none; width: 44px; height: 44px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: rgba(20, 30, 50, .8); border: 1px solid #33445f; color: var(--ink); }
  .dclose:active { background: rgba(40, 55, 82, .9); }
  .dbody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
           padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }

  #card {
    position: fixed; left: 50%; bottom: -110%; transform: translateX(-50%);
    width: min(94vw, 420px); z-index: 60;
    max-height: 82vh; max-height: 84dvh; /* never taller than the phone */
    display: flex; flex-direction: column; padding: 0;
    background: rgba(8, 14, 28, .92); border: 1px solid #2a3a58; border-radius: 16px 16px 0 0;
    transition: bottom .35s cubic-bezier(.3,.9,.3,1); backdrop-filter: blur(8px);
  }
  #card.open { bottom: 0; }
  #card .rows { margin-top: 10px; font-size: 13px; line-height: 1.9; }
  #card .rows b { color: var(--ink); font-weight: 600; float: right; font-variant-numeric: tabular-nums; }
  #card .rows span { color: var(--dim); letter-spacing: .08em; }
  #card .unavail { margin: 14px 0 6px; color: #ffb454; font-size: 13px; letter-spacing: .12em; }
  #card .depth { margin-top: 10px; }
  #card .drow { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dim); margin: 4px 0; }
  #card .drow .bar { height: 6px; border-radius: 3px; }
  #card .drow .bid { background: #2f9e77; margin-left: auto; }
  #card .drow .ask { background: #b0543f; }
  #card .drow .mid { width: 46px; text-align: center; letter-spacing: .1em; flex: none; }
  #card .demoNote { margin-top: 10px; font-size: 10px; color: #b8860b; letter-spacing: .14em; }

  /* ============ ledger panel (read-only; can never place or cancel anything) ============ */
  #ledger {
    position: fixed; left: 50%; bottom: -110%; transform: translateX(-50%);
    width: min(94vw, 430px); z-index: 70;
    max-height: 80vh; max-height: 84dvh;
    display: flex; flex-direction: column; padding: 0;
    background: rgba(7, 12, 24, .94); border: 1px solid #29394f; border-radius: 16px 16px 0 0;
    transition: bottom .35s cubic-bezier(.3,.9,.3,1); backdrop-filter: blur(10px);
  }
  #ledger.open { bottom: 0; }
  #ledger .dhead h2 { color: #7fc7de; font-size: 13px; letter-spacing: .34em; }
  #ledger .net { margin-top: 10px; font-size: clamp(20px, 6vw, 26px); font-weight: 700;
                 font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #ledger .net .pos, #ledger .trow .pos { color: #4fd598; }
  #ledger .net .neg, #ledger .trow .neg { color: #ff7a6b; }
  #ledger .line { margin-top: 6px; font-size: 12px; color: var(--ink); opacity: .85;
                  font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  #ledger .line span { color: var(--dim); }
  #ledger .trades { margin-top: 12px; border-top: 1px solid #1c2942; }
  #ledger .trow { display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
                  border-bottom: 1px solid #14203a; font-size: 11px;
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ledger .trow .t { color: var(--dim); width: 66px; flex: none; }
  #ledger .trow .sym { width: 44px; flex: none; font-weight: 600; }
  #ledger .trow .px { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #ledger .trow .net { margin: 0 0 0 auto; font-size: 11px; font-weight: 700; flex: none; }
  #ledger .trow .wl { width: 12px; flex: none; text-align: center; }
  #ledger .trow .rsn { color: var(--dim); font-size: 9px; letter-spacing: .08em; flex: none; }
  #ledger .symstrip { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #ledger .symstrip div { font-size: 10px; letter-spacing: .1em; padding: 4px 9px; border-radius: 12px;
                          border: 1px solid #22334c; color: var(--dim); font-variant-numeric: tabular-nums; }
  #ledger .fees { margin-top: 12px; font-size: 11px; letter-spacing: .18em; color: #c7a15a; }
  #ledger .empty { margin: 18px 0 8px; text-align: center; }
  #ledger .empty .big { font-size: 14px; letter-spacing: .18em; color: var(--ink); }
  #ledger .empty .sub { margin-top: 8px; font-size: 11px; color: var(--dim); letter-spacing: .12em; }
  #ledger .openpos { margin-top: 10px; border-top: 1px solid #1c2942; padding-top: 6px; }

  /* ============ boot ============ */
  #boot { position: fixed; inset: 0; background: #01030a; z-index: 100;
          display: flex; align-items: center; justify-content: center;
          transition: opacity .7s ease; }
  #boot span { color: #24445a; font-size: 12px; letter-spacing: .6em; animation: bootPulse 1.2s ease-in-out infinite; }
  @keyframes bootPulse { 50% { opacity: .35; } }
  body:not(.booting) #boot { opacity: 0; pointer-events: none; }
  body.booting #verdict, body.booting .planet { opacity: 0; }
  #verdict, .planet { transition: opacity 1s ease .2s; opacity: 1; }
#card input{width:100%;margin:8px 0;padding:10px;background:rgba(10,14,20,.9);border:1px solid #223;color:inherit;font:inherit;border-radius:6px}
</style>
</head>
<body class="booting" data-posture="COILED">

</div>

<script>
'use strict';
/* The shell displays. It never decides. Every number rendered as real data
   was read from disk by the server; anything else is dashes or UNAVAILABLE. */

const $ = (s) => document.querySelector(s);
const body = document.body;
const PLANET_STYLE = {
  BTC:  'radial-gradient(circle at 34% 30%, #ffd9a0, #f7931a 55%, #7a4507)',
  ETH:  'radial-gradient(circle at 34% 30%, #cdd2ff, #8a92ff 55%, #383e8f)',
  SOL:  'radial-gradient(circle at 34% 30%, #b9ffe9, #14f195 55%, #0b6a52)',
  XRP:  'radial-gradient(circle at 34% 30%, #bfe7ff, #25a4e8 55%, #114b6e)',
  DOGE: 'radial-gradient(circle at 34% 30%, #f4e6b8, #cba635 55%, #6b5312)',
  // UI-1C: recognisable badge colors for common prey — presentation only
  SUI:  'radial-gradient(circle at 34% 30%, #c8e6ff, #4da2ff 55%, #1a4a86)',
  AVAX: 'radial-gradient(circle at 34% 30%, #ffc4c1, #e84142 55%, #6e1414)',
  LINK: 'radial-gradient(circle at 34% 30%, #c3d2ff, #2a5ada 55%, #12275e)',
  ADA:  'radial-gradient(circle at 34% 30%, #b8ccff, #2456d8 55%, #0d2a6e)',
  TON:  'radial-gradient(circle at 34% 30%, #bfe9ff, #0098ea 55%, #044a70)',
  MATIC:'radial-gradient(circle at 34% 30%, #dcc9ff, #8247e5 55%, #3a1d6e)',
  POL:  'radial-gradient(circle at 34% 30%, #dcc9ff, #8247e5 55%, #3a1d6e)',
  PEPE: 'radial-gradient(circle at 34% 30%, #c9f0b8, #3d8130 55%, #1b3a14)',
  BNB:  'radial-gradient(circle at 34% 30%, #ffe9b0, #f3ba2f 55%, #7a5a10)',
  LTC:  'radial-gradient(circle at 34% 30%, #e6ecf2, #a5b3c2 55%, #4a5563)',
  DOT:  'radial-gradient(circle at 34% 30%, #ffc4d8, #e6007a 55%, #6e0038)',
};
// badge glyph: a currency mark where one exists, else the first character.
// Pure presentation drawn FROM the symbol — never data about the coin.
const PLANET_GLYPH = { BTC: '₿', ETH: 'Ξ', DOGE: 'Ð', XRP: '✕', LTC: 'Ł', ADA: '₳' };
const planetGlyph = (coin) => PLANET_GLYPH[coin] ?? coin[0] ?? '';

/* ---------- state ---------- */
let universe = ['BTC', 'ETH', 'SOL', 'XRP', 'DOGE'];
let lastStatus = null;
let demo = new URLSearchParams(location.search).get('demo') === '1';
let demoTimer = null, demoIdx = 0, demoTarget = null;
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- starfield with Ophiuchus ---------- */
const canvas = $('#stars'), ctx = canvas.getContext('2d');
let stars = [], W = 0, H = 0;
// Ophiuchus, the serpent-bearer — its brightest stars, roughly placed.
// Nobody needs to notice. We'll know.
const OPHIUCHUS = [
  [.52,.08],[.66,.16],[.42,.22],[.72,.30],[.82,.40],[.18,.38],[.22,.44],[.38,.66],[.58,.62],[.68,.78],
];
function seedStars() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = [];
  const layers = [ [90, .35, .0016], [55, .8, .0038], [26, 1.3, .0075] ];
  for (const [n, r, v] of layers) {
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: r * (0.7 + Math.random() * 0.6),
                   v, a: 0.25 + Math.random() * 0.5, tw: Math.random() * Math.PI * 2 });
    }
  }
  // constellation stars: a touch brighter, upper field
  for (const [nx, ny] of OPHIUCHUS) {
    stars.push({ x: W * (0.18 + nx * 0.64), y: H * (0.04 + ny * 0.30), r: 1.7,
                 v: 0.0016, a: 0.85, tw: Math.random() * Math.PI * 2, oph: true });
  }
}
function drawStars(t) {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    if (!reduced) { s.x -= s.v; s.y += s.v * 0.35; if (s.x < -2) s.x = W + 2; if (s.y > H + 2) s.y = -2; }
    const tw = reduced ? 1 : (0.82 + 0.18 * Math.sin(t / 900 + s.tw));
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.oph ? '#cfe8ff' : '#9fb4c8';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* UI-1B2: ONE strong serpent. The old thin inner spiral is gone (no
   spaghetti coils) — the coil band IS the animal, and it MOVES: the whole
   visible body rotates so its head tracks the focal prey in REAL mode
   (idle: a slow continuous crawl). Pure functions are extracted for tests. */
// per-frame orbital advance (pure): rad = rad/s * seconds
function orbitStep(speed, dtMs) { return speed * (dtMs / 1000); }
// head aim smoothing (pure): shortest-arc approach, ~0.9s settle
function coilAim(currentDeg, targetDeg, dtMs) {
  const d = ((targetDeg - currentDeg + 540) % 360) - 180;
  return currentDeg + d * Math.min(1, dtMs / 900);
}
const COIL_IDLE_DEG_S = 16; // idle crawl: a full turn in ~22s — unmistakably alive
const HEAD_HOME_DEG = -34.5; // where the painted head sits in the unrotated artwork
let coilAngle = 0;
let coilClock = 0; // ms — drives the weave sway and the sniff rhythm
// UI-1C7: predator life. (pure) organic side-to-side weave laid over the
// aim — the sniffing sway of a head that is never perfectly still.
function coilWeave(tMs) {
  return 2.6 * Math.sin(tMs / 1400) + 1.4 * Math.sin(tMs / 530 + 1.7);
}
// the sniff cycle: mostly locked on its prey, but every few seconds the
// head swings to CHECK another coin actually on display, then returns.
const GLANCE_EVERY_MS = 7000, GLANCE_HOLD_MS = 1700;
let glanceCoin = null, glanceUntil = 0, nextGlanceAt = GLANCE_EVERY_MS, glanceIdx = 0;
function pickGlance(primary) {
  // only coins truly on display — never an invented target
  const live = [...planets.values()].filter((q) => !q.dying && q.sx != null && q.coin !== primary);
  if (!live.length) return null;
  live.sort((a, b) => (a.meta?.tier ?? 9) - (b.meta?.tier ?? 9) || a.rank - b.rank);
  return live[glanceIdx++ % live.length].coin;
}
function updateCoil(dtMs) {
  if (body.classList.contains('killed')) { $('#gaze').classList.remove('on'); return; } // dormant under KILL
  coilClock += dtMs;
  const primary = demo ? demoTarget : focusSymbol;
  if (!reduced) {
    if (coilClock >= nextGlanceAt) {
      glanceCoin = pickGlance(primary);
      glanceUntil = coilClock + GLANCE_HOLD_MS;
      nextGlanceAt = coilClock + GLANCE_EVERY_MS + (coilClock % 2600); // organic, not metronomic
    }
    if (coilClock > glanceUntil) glanceCoin = null;
  } else {
    glanceCoin = null; // reduced motion: information only, no theatrics
  }
  const targetCoin = glanceCoin ?? primary;
  const p = targetCoin ? planets.get(targetCoin) : null;
  let target;
  if (p && p.sx != null) {
    // aim the head at the prey's apparent position — "watching THAT coin"
    const cx = innerWidth / 2, cy = innerHeight * 0.48;
    target = (Math.atan2(p.sy - cy, p.sx - cx) * 180) / Math.PI - HEAD_HOME_DEG;
  } else if (!reduced) {
    target = coilAngle + (COIL_IDLE_DEG_S * dtMs) / 1000; // alive even at rest
  } else {
    target = coilAngle;
  }
  coilAngle = reduced ? target : coilAim(coilAngle, target, dtMs);
  coilAngle = ((coilAngle % 360) + 360) % 360;
  const shown = coilAngle + (reduced ? 0 : coilWeave(coilClock));
  $('#coilSpin').setAttribute('transform', `rotate(${shown.toFixed(2)} 0 0)`); // explicit pivot: the coil's center
  // UI-1C6: the HUNT made legible — a faint marching sight-line from the
  // head to the coin it is checking right now (its prey, or a brief
  // glance target). Never invented, gone under KILL.
  const gaze = $('#gaze');
  if (p && p.sx != null) {
    const hr = (Math.min(0.96 * Math.min(innerWidth, innerHeight), 400) / 340) * 104;
    const ha = ((HEAD_HOME_DEG + shown) * Math.PI) / 180;
    const l = $('#gazeLine');
    l.setAttribute('x1', (innerWidth / 2 + hr * Math.cos(ha)).toFixed(1));
    l.setAttribute('y1', (innerHeight * 0.48 + hr * Math.sin(ha)).toFixed(1));
    l.setAttribute('x2', p.sx.toFixed(1));
    l.setAttribute('y2', p.sy.toFixed(1));
    gaze.classList.add('on');
  } else {
    gaze.classList.remove('on');
  }
}

/* UI-1A §9: the hunting ring as SERPENT BODY. A closed tapered band with
   organic wobble; the head end (thicker, subtly widened, with an eye)
   passes OVER the thinner tail through a background-colored casing gap.
   All geometry, no artwork. */
function buildCoilRing() {
  const N = 260;
  const centre = (p) => {
    const a = -Math.PI / 2 + p * 2 * Math.PI;
    const r = 104 + Math.sin(a * 5 + 0.8) * 1.2 + Math.sin(a * 3 - 1.2) * 0.8;
    return [r * Math.cos(a), r * Math.sin(a), a];
  };
  // UI-1C3: body half-width at the concept frame's proportion — the band
  // is ~a quarter of the ring radius. Pointed tail tip (it slides under
  // the head), heavy body, neck easing into the sculpted skull.
  const halfW = (p) => {
    if (p < 0.06) return 1.6 + (p / 0.06) * 4.9; // tail tip tapers to a point
    if (p > 0.9) return 12 - ((p - 0.9) / 0.1) * 4; // neck eases INTO the skull
    const t = Math.min((p - 0.06) / 0.74, 1);
    return 6.5 + t * 5.5; // body swells 6.5 -> 12
  };
  const band = (p0, p1) => {
    const outer = [], inner = [];
    const steps = Math.max(8, Math.round((p1 - p0) * N));
    for (let i = 0; i <= steps; i++) {
      const p = p0 + ((p1 - p0) * i) / steps;
      const [x, y, a] = centre(p);
      const w = halfW(p);
      outer.push(`${(x + w * Math.cos(a)).toFixed(1)},${(y + w * Math.sin(a)).toFixed(1)}`);
      inner.push(`${(x - w * Math.cos(a)).toFixed(1)},${(y - w * Math.sin(a)).toFixed(1)}`);
    }
    return 'M' + outer.join(' L') + ' L' + inner.reverse().join(' L') + ' Z';
  };
  const line = (p0, p1, offset) => {
    const pts = [];
    const steps = Math.max(8, Math.round((p1 - p0) * N));
    for (let i = 0; i <= steps; i++) {
      const p = p0 + ((p1 - p0) * i) / steps;
      const [x, y, a] = centre(p);
      const o = offset(p);
      pts.push(`${(x + o * Math.cos(a)).toFixed(1)},${(y + o * Math.sin(a)).toFixed(1)}`);
    }
    return 'M' + pts.join(' L');
  };
  $('#coilTail').setAttribute('d', band(0, 0.985));
  // the casing is only a sliver directly beneath the skull, so the head
  // pops off the band — the thin tail tip stays VISIBLE, sliding behind
  // the neck exactly like the concept frame (centre() accepts p > 1)
  $('#coilCasing').setAttribute('d', line(0.972, 1.005, () => 0));
  $('#coilCasing').setAttribute('stroke-width', '28');
  // a thin light along the upper body — dimensional, not glossy
  $('#coilHighlight').setAttribute('d', line(0.08, 0.9, (p) => -halfW(p) * 0.45));
  // UI-1C6: the artwork ouroboros is centred on the ring; no mount needed.
  // Its painted head sits at HEAD_HOME_DEG, and #coilSpin's rotation
  // (updateCoil) swings that head to whatever prey it is checking.
}

/* ---------- arcs (lock ring + ET session) ---------- */
const polar = (r, deg) => [r * Math.cos((deg - 90) * Math.PI / 180), r * Math.sin((deg - 90) * Math.PI / 180)];
function arcPath(r, fromDeg, toDeg) {
  const [x1, y1] = polar(r, fromDeg), [x2, y2] = polar(r, toDeg);
  const large = toDeg - fromDeg > 180 ? 1 : 0;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)}`;
}
const LOCK_R = 140, LOCK_FROM = -120, LOCK_SWEEP = 240; // 0..+11% maps onto 240°
function renderLockRing(locks) {
  const g = $('#lockRing');
  if (!locks) { g.style.display = 'none'; return; }
  g.style.display = '';
  $('#lockBase').setAttribute('d', arcPath(LOCK_R, LOCK_FROM, LOCK_FROM + LOCK_SWEEP));
  const th = locks.thresholds, hard = th.hardPct;
  const ticks = [th.selectivePct, th.protectPct, th.hardPct].map((pct) => {
    const deg = LOCK_FROM + (pct / hard) * LOCK_SWEEP;
    const [x1, y1] = polar(LOCK_R - 6, deg), [x2, y2] = polar(LOCK_R + 6, deg);
    const hot = locks.pnlPct >= pct ? ' hot' : '';
    return `<line class="tick${hot}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  });
  $('#lockTicks').innerHTML = ticks.join('');
  const frac = Math.max(0, Math.min(locks.pnlPct, hard)) / hard;
  $('#lockFill').setAttribute('d', frac > 0.004 ? arcPath(LOCK_R, LOCK_FROM, LOCK_FROM + frac * LOCK_SWEEP) : '');
}

/* ---------- planets: the hunting orbit (UI-1: dynamic display attention) ----------
   The orbit shows what Serpent is actually WATCHING (stalks, ripples,
   social attention) with the configured majors as quiet fallback. DISPLAY
   ATTENTION != BITEABLE — appearing here never implies eligibility.
   Symbols come from our own server, are strict tokens (validated), and are
   rendered as text only. Focus changes glide; the page never rebuilds. */
const SYM_RE = /^[A-Z0-9]{1,12}$/;
function planetStyle(coin) {
  if (PLANET_STYLE[coin]) return PLANET_STYLE[coin];
  let h = 0;
  for (const ch of coin) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `radial-gradient(circle at 34% 30%, hsl(${h} 82% 84%), hsl(${h} 72% 55%) 55%, hsl(${h} 60% 22%))`;
}
const planets = new Map();
let focusSymbol = null;
let lastAttention = null; // last good snapshot for the hunt drawer
let attentionAtMs = 0;
const ATTENTION_STALE_MS = 60_000; // stale focal prey never lingers (§37)
function makePlanet(coin) {
  const el = document.createElement('div');
  el.className = 'planet';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.innerHTML = `
    <svg class="reticle" viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#ffb454" stroke-width="1.4"
              stroke-dasharray="6 5" opacity=".9"></circle>
      <ellipse cx="30" cy="30" rx="2.2" ry="8" fill="#ffb454" opacity=".95"></ellipse>
    </svg>
    <div class="trail" aria-hidden="true"></div>
    <div class="body" style="background:${planetStyle(coin)}"><span class="glyph"></span></div>
    <div class="lbl"></div>
    <div class="nomdot"></div>`;
  el.querySelector('.lbl').textContent = coin; // symbol is data, not markup
  el.querySelector('.glyph').textContent = planetGlyph(coin); // ditto
  el.addEventListener('click', () => openCard(coin));
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(coin); } });
  $('#planets').appendChild(el);
  const p = {
    el, coin, lblEl: el.querySelector('.lbl'), trailEl: el.querySelector('.trail'),
    phase: Math.random() * Math.PI * 2,
    // §4: visibly alive — obvious progress within 10-15s, still elegant
    speed: 0.07 + (planets.size % 6) * 0.012,
    rank: planets.size, pull: 1.28, fade: 0, dying: false, meta: null, lblDy: 0,
  };
  planets.set(coin, p);
  return p;
}

/* UI-1A §12 — PURE collision solver for coin labels. Given label boxes
   ({x,y,w,h,priority}; y = box top) and the verdict box (center rect), it
   returns a bounded vertical offset per label: focal/high-priority labels
   place first, later labels dodge the verdict and already-placed labels
   through a small candidate set. Offsets never exceed ±24px, so labels
   stay glued to their coin and inside mobile bounds. */
function resolveLabelOffsets(labels, verdict) {
  const out = new Array(labels.length).fill(0);
  const rect = (l, dy) => ({ l: l.x - l.w / 2, r: l.x + l.w / 2, t: l.y + dy, b: l.y + dy + l.h });
  const hit = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
  const vrect = { l: verdict.x - verdict.w / 2, r: verdict.x + verdict.w / 2, t: verdict.y - verdict.h / 2, b: verdict.y + verdict.h / 2 };
  const order = labels.map((_, i) => i).sort((a, b) => (labels[b].priority ?? 0) - (labels[a].priority ?? 0));
  const placed = [];
  for (const i of order) {
    let chosen = 0;
    for (const dy of [0, -24, 14, -14, 24]) {
      const r = rect(labels[i], dy);
      if (hit(r, vrect)) continue;
      if (placed.some((j) => hit(r, rect(labels[j], out[j])))) continue;
      chosen = dy;
      break;
    }
    out[i] = chosen;
    placed.push(i);
  }
  return out;
}
// Reconcile displayed prey with the attention snapshot — additions drift in
// from the outside, departures fade out, focus docks on the inner coil.
function syncOrbit(list, focus) {
  const want = new Set();
  list.forEach((entry, i) => {
    if (!SYM_RE.test(entry.symbol)) return;
    want.add(entry.symbol);
    const p = planets.get(entry.symbol) ?? makePlanet(entry.symbol);
    p.meta = entry;
    p.rank = i;
    p.dying = false;
    const what = entry.tier === 1 ? 'active stalking' : entry.tier === 2 ? 'wide eye ripple'
      : entry.tier === 3 ? 'social attention' : entry.tier === 4 ? 'remembered attention' : 'watched major';
    p.el.setAttribute('aria-label', `${entry.symbol} — ${what} — tap for details`);
  });
  for (const p of planets.values()) if (!want.has(p.coin)) p.dying = true;
  focusSymbol = focus && SYM_RE.test(focus) ? focus : null;
}
/* UI-1B2 §3 (pure): importance is SPATIAL — genuine attention orbits the

   outer rim. Display tier only — never a trading score. */
function tierRadiusFactor(tier, rank) {
  const band = tier <= 2 ? 0.74 : tier <= 4 ? 0.95 : 1.15;
  return band + (rank % 3) * 0.045;
}
function layoutPlanets(t, dtMs = 16) {
  const cx = innerWidth / 2, cy = innerHeight * 0.48;
  // keep the widest orbit + planet body inside the viewport edge
  const baseR = Math.min((innerWidth / 2 - 30) / 1.2, innerHeight * 0.34, 185);
  for (const [coin, p] of planets) {
    if (!reduced) p.phase += orbitStep(p.speed, dtMs);
    p.fade += ((p.dying ? 0 : 1) - p.fade) * (reduced ? 1 : 0.05);
    if (p.dying && p.fade < 0.03) { p.el.remove(); planets.delete(coin); continue; }
    const focal = !demo && coin === focusSymbol;
    const fac = tierRadiusFactor(p.meta?.tier ?? 5, p.rank);
    // the focal prey docks ON the innermost hunting ring — closest to the
    // animal, never covering the verdict at the center
    const ringPx = Math.min(0.96 * Math.min(innerWidth, innerHeight), 400) * (104 / 340) + 12;
    const target = (demo && demoTarget === coin) ? 0.52
      : focal ? Math.min(1, Math.max(0.4, ringPx / (baseR * fac))) : 1;
    p.pull += (target - p.pull) * (reduced ? 1 : 0.04);
    const rx = baseR * fac * p.pull;
    const x = cx + rx * Math.cos(p.phase);
    const y = cy + rx * 0.55 * Math.sin(p.phase);
    const depth = (Math.sin(p.phase) + 1) / 2;            // 0 back, 1 front
    const sc = (0.82 + depth * 0.3) * (focal ? 1.12 : 1);
    p.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${sc.toFixed(3)})`;
    p.el.style.zIndex = String(10 + Math.round(depth * 9) + (focal ? 5 : 0));
    p.el.style.opacity = ((0.62 + depth * 0.38) * p.fade).toFixed(2);
    p.el.classList.toggle('stalked', (demo && demoTarget === coin) || (!demo && p.meta?.tier === 1));
    p.el.classList.toggle('focal', focal);
    p.el.classList.toggle('nominated', !demo && p.meta?.tier === 3);
    p.el.classList.toggle('quiet', !demo && Boolean(p.meta?.fallback)); // fallback never poses as prey
    // UI-1C: the comet trail lies along the actual velocity, tail behind —
    // decoration derived from real motion, hidden entirely under reduced
    if (!reduced) {
      const vx = -rx * Math.sin(p.phase), vy = rx * 0.55 * Math.cos(p.phase);
      p.trailEl.style.transform =
        `translate(-100%,-50%) rotate(${((Math.atan2(vy, vx) * 180) / Math.PI).toFixed(1)}deg)`;
    }
    p.sx = x; p.sy = y; p.focal = focal; // screen position for label layout
  }
  // §12: collision-aware labels — priority to the focal prey, verdict kept clear
  const live = [...planets.values()].filter((p) => !p.dying);
  const labels = live.map((p) => ({
    x: p.sx ?? 0, y: (p.sy ?? 0) + 12, w: 50, h: 14,
    priority: p.focal ? 3 : p.meta?.tier === 1 ? 2 : p.meta && !p.meta.fallback ? 1 : 0,
  }));
  const offsets = resolveLabelOffsets(labels, { x: cx, y: cy, w: Math.min(innerWidth * 0.62, 300), h: 86 });
  live.forEach((p, i) => {
    p.lblDy += (offsets[i] - p.lblDy) * (reduced ? 1 : 0.2);
    p.lblEl.style.transform = `translateY(${p.lblDy.toFixed(1)}px)`;
  });
}
// §37: attention arriving is truth; attention failing falls back to the
// configured majors — nothing invented, nothing stale left focal forever.
function majorsFallback() {
  // tier 5 matches the server's snapshot tiers (4 = remembered attention)
  return universe.map((symbol) => ({ symbol, tier: 5, fallback: true, reason: 'configured major — quiet fallback' }));

function applyAttention(a) {
  if (a && Array.isArray(a.orbit)) {
    lastAttention = a;
    attentionAtMs = Date.now();
    syncOrbit(a.orbit, a.focus?.symbol ?? null);

}

  return `${(m / 60).toFixed(1)}h ago`;
}
function renderAttractionSection(bodyEl, att) {
  bodyEl.append(el('h3', 'sec', 'ATTRACTION'));
  if (att?.stalking) {
    bodyEl.append(el('div', 'tierline', 'ACTIVE STALK'));
    bodyEl.append(obsRow('cause', att.stalking.reason));
    if (att.stalking.since) bodyEl.append(obsRow('first seen', agoStr(att.stalking.since)));
    if (att.stalking.expiresMs) {
      const left = Math.max(0, (att.stalking.expiresMs - Date.now()) / 60_000);
      bodyEl.append(obsRow('expires', `${Math.round(left)}m`));
    }
  } else if (att?.wideEye) {
    bodyEl.append(el('div', 'tierline', 'WIDE EYE RIPPLE'));
    if (att.wideEye.zVol != null) bodyEl.append(obsRow('volume z', att.wideEye.zVol));
    if (att.wideEye.zRet != null) bodyEl.append(obsRow('return z', att.wideEye.zRet));
    if (att.wideEye.extension != null) bodyEl.append(obsRow('extension', `${att.wideEye.extension}%`));
    bodyEl.append(obsRow('observed', agoStr(att.wideEye.ts)));
  } else if (att?.rumint?.nomination || att?.rumint?.hyped) {
    bodyEl.append(el('div', 'tierline', 'SOCIAL ATTENTION'));
    if (att.rumint.nomination) {
      bodyEl.append(obsRow('cause', att.rumint.nomination.reason));
      bodyEl.append(obsRow('observed', agoStr(att.rumint.nomination.ts)));
    }
    if (att.rumint.hyped) bodyEl.append(obsRow('status', 'HYPED'));
  } else {
    bodyEl.append(el('div', 'quiet', 'NO CURRENT ATTENTION — QUIET WATCH'));
  }
}
function renderSocialSection(bodyEl, rumint) {
  bodyEl.append(el('h3', 'sec', 'SOCIAL / RUMORS'));
  const sig = rumint?.signal;
  if (!sig && !rumint?.hyped && !rumint?.nomination) {
    bodyEl.append(el('div', 'quiet', 'NO MEANINGFUL SOCIAL SIGNAL'));
    return;
  }
  if (sig) {
    bodyEl.append(obsRow('chatter velocity', sig.velocity != null ? `${sig.velocity}/hr` : 'UNAVAILABLE'));
    bodyEl.append(obsRow('velocity z', sig.zVelocity != null ? sig.zVelocity.toFixed(2) : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('acceleration', sig.acceleration != null ? sig.acceleration : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('sentiment shift', sig.sentimentShift != null ? sig.sentimentShift.toFixed(2) : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('source', sig.source ?? 'RUMINT'));
  }
  if (rumint?.hyped) bodyEl.append(obsRow('today', 'HYPED'));
}
function renderMarketSection(bodyEl, d) {
  bodyEl.append(el('h3', 'sec', 'MARKET'));
  if (!d.available) {
    bodyEl.append(el('div', 'quiet', d.reason || 'UNAVAILABLE — NO TRADE'));
    return;
  }
  const rows = el('div', 'rows');
  const mk = (label, val) => { const r = el('div'); r.append(el('span', null, label), el('b', null, val)); return r; };
  rows.append(
    mk('MID', d.mid.toLocaleString('en-US', { maximumFractionDigits: 6 })),
    mk('BID / ASK', `${d.bestBid} / ${d.bestAsk}`),
    mk('SPREAD', `${d.spreadBps.toFixed(2)} bps`),
    mk('BOOK AGE', `${d.ageSec.toFixed(1)} s`),
    mk('LEVELS', `${d.levels.bids} bid / ${d.levels.asks} ask`)
  );
  bodyEl.append(rows);
  const bands = ['5bps', '10bps', '25bps'];
  const maxD = Math.max(...bands.flatMap((b) => [d.depthUsd[b].bid, d.depthUsd[b].ask]));
  const depth = el('div', 'depth');
  for (const b of bands) {
    const row = el('div', 'drow');
    const bidLbl = el('span', null, fmtUsd(d.depthUsd[b].bid)); bidLbl.style.cssText = 'width:74px;text-align:right';
    const bid = el('div', 'bar bid'); bid.style.width = `${Math.max(3, (d.depthUsd[b].bid / maxD) * 92)}px`;
    const ask = el('div', 'bar ask'); ask.style.width = `${Math.max(3, (d.depthUsd[b].ask / maxD) * 92)}px`;
    const askLbl = el('span', null, fmtUsd(d.depthUsd[b].ask)); askLbl.style.width = '74px';
    row.append(bidLbl, bid, el('div', 'mid', `±${b.replace('bps', '')}bp`), ask, askLbl);
    depth.append(row);
  }
  bodyEl.append(depth);
}
function renderMemorySection(bodyEl, memory) {
  bodyEl.append(el('h3', 'sec', 'MEMORY'));
  const records = memory?.records ?? [];
  if (!records.length) {
    bodyEl.append(el('div', 'quiet', memory?.meta?.mode === 'LOCAL_ONLY' ? 'LOCAL SESSION MEMORY ONLY — NOTHING RECENT' : 'NO RECENT MEMORY'));
    return;
  }
  for (const rec of [...records].reverse()) {
    const row = el('div', 'obs');
    row.append(el('span', 'm', `${rec.sourceModule} · ${rec.eventType}`));
    row.append(el('span', 'v', `${rec.observationState} · ${agoStr(rec.ts * 1000)}`));
    bodyEl.append(row);
  }
}
async function openCard(coin) {
  showCard({ kicker: 'COIN DETAIL', title: coin, coin: true }); // the ticker is unmissable and stays put
  const bodyEl = $('#cardBody');
  if (demo) {
    bodyEl.replaceChildren();
    const rows = el('div', 'rows');
    for (const k of ['PRICE', 'SPREAD', 'BOOK AGE', 'DEPTH']) {
      const r = el('div'); r.append(el('span', null, k), el('b', null, '—')); rows.append(r);
    }
    bodyEl.append(rows, el('div', 'demoNote', 'DEMO — STAGED VISUALS. THESE ARE NOT MARKET VALUES.'));
    return;
  }
  bodyEl.replaceChildren(el('div', 'quiet', 'reading tape…'));
  try {
    const d = await (await fetch('/api/coin/' + encodeURIComponent(coin), { cache: 'no-store' })).json();
    bodyEl.replaceChildren();
    bodyEl.append(el('div', 'quiet', 'WHY AM I WATCHING THIS?'));
    renderAttractionSection(bodyEl, d.attention);
    renderSocialSection(bodyEl, d.attention?.rumint);
    renderMarketSection(bodyEl, d);
    renderMemorySection(bodyEl, d.memory);
  } catch {
    bodyEl.replaceChildren(el('div', 'unavail', 'UNAVAILABLE — shell link lost'));
  }
}

/* ---------- Hunt drawer: WHAT SERPENT IS WATCHING (never a buy list) ---------- */
function openHuntCard() {
  showCard({ kicker: 'SERPENT', title: 'WATCHING' });
  const bodyEl = $('#cardBody');
  bodyEl.replaceChildren();
  const a = lastAttention;
  const tierWord = (t) => (t === 1 ? 'active stalk' : t === 2 ? 'wide eye ripple' : t === 3 ? 'social attention' : t === 4 ? 'remembered attention' : 'quiet fallback');
  if (a?.focus) {
    bodyEl.append(el('h3', 'sec', 'FOCUS'));
    bodyEl.append(el('div', 'tierline', a.focus.symbol));
    bodyEl.append(obsRow(tierWord(a.focus.tier), a.focus.reason));
    if (a.focus.ts) bodyEl.append(obsRow('refreshed', agoStr(a.focus.ts)));
  } else {
    bodyEl.append(el('div', 'quiet', 'NO CURRENT FOCUS — WATCHING THE MAJORS'));
  }
  const others = (a?.orbit ?? []).filter((e) => !e.fallback && e.symbol !== a?.focus?.symbol);
  if (others.length) {
    bodyEl.append(el('h3', 'sec', 'OTHER ATTENTION'));
    for (const e of others) {
      const row = el('div', 'obs');
      row.append(el('span', 'm', e.symbol));
      row.append(el('span', 'v', `${tierWord(e.tier)} · ${e.ts ? agoStr(e.ts) : '—'}`));
      bodyEl.append(row);
    }
  }
  // §5: the quiet fallback majors, truthfully separated from real attention
  const quiet = (a?.orbit ?? []).filter((e) => e.fallback);
  if (quiet.length) {
    bodyEl.append(el('h3', 'sec', 'QUIET / FALLBACK'));
    for (const e of quiet) {
      const row = el('div', 'obs');
      row.append(el('span', 'm', e.symbol));
      row.append(el('span', 'v', 'quiet fallback major'));
      bodyEl.append(row);
    }
  }
  bodyEl.append(el('div', 'quiet', 'WHAT SERPENT IS WATCHING — NOT ADVICE, NOT ELIGIBILITY'));
}

/* ---------- EARS: the rumor room (read-only; nulls stay honest) ---------- */
async function openEarsCard() {
  showCard({ kicker: 'EARS', title: 'RUMOR ROOM' });
  const bodyEl = $('#cardBody');
  bodyEl.replaceChildren(el('div', 'quiet', 'listening…'));
  try {
    const d = await (await fetch('/api/ears', { cache: 'no-store' })).json();
    bodyEl.replaceChildren();
    const st = d.status ?? {};
    bodyEl.append(el('div', 'quiet', st.enabled
      ? (st.backoff ? 'EARS IN BACK-OFF' : `EARS ON · ${st.symbolsPolled} symbols polled${st.fresh ? '' : ' · NOT FRESH'}`)
      : 'EARS OFF'));
    if (!d.symbols?.length) {
      bodyEl.append(el('div', 'quiet', 'NO MEANINGFUL SOCIAL SIGNAL'));
      return;
    }
    for (const s of d.symbols) {
      bodyEl.append(el('h3', 'sec', s.symbol + (s.hyped ? ' · HYPED' : '')));
      if (s.stalkCause) bodyEl.append(obsRow('active stalk', s.stalkCause));
      if (s.nomination) {
        bodyEl.append(obsRow('nomination', s.nomination.reason));
        bodyEl.append(obsRow('observed', agoStr(s.nomination.ts)));
      }
      const sig = s.signal;
      if (sig) {
        bodyEl.append(obsRow('chatter velocity', sig.velocity != null ? `${sig.velocity}/hr` : 'UNAVAILABLE'));
        bodyEl.append(obsRow('velocity z', sig.zVelocity != null ? sig.zVelocity.toFixed(2) : 'INSUFFICIENT HISTORY'));
        bodyEl.append(obsRow('acceleration', sig.acceleration != null ? sig.acceleration : 'INSUFFICIENT HISTORY'));
        bodyEl.append(obsRow('sentiment shift', sig.sentimentShift != null ? sig.sentimentShift.toFixed(2) : 'INSUFFICIENT HISTORY'));
      } else {
        bodyEl.append(el('div', 'quiet', 'INSUFFICIENT HISTORY'));
      }
    }
  } catch {
    bodyEl.replaceChildren(el('div', 'unavail', 'UNAVAILABLE — shell link lost'));
  }
}

/* ---------- WIDE EYE: bounded recent scanner view ---------- */
async function openEyeCard() {
  showCard({ kicker: 'SCANNER', title: 'WIDE EYE' });
  const bodyEl = $('#cardBody');
  bodyEl.replaceChildren(el('div', 'quiet', 'scanning…'));
  try {
    const d = await (await fetch('/api/wideeye', { cache: 'no-store' })).json();
    bodyEl.replaceChildren();
    const st = d.status ?? {};
    bodyEl.append(el('div', 'quiet', st.enabled
      ? `${st.scanned} SCANNED · ${st.ripplesToday} RIPPLE${st.ripplesToday === 1 ? '' : 'S'} TODAY${st.fresh ? '' : ' · NOT FRESH'}`
      : 'WIDE EYE OFF'));
    if (!d.ripples?.length) {
      bodyEl.append(el('div', 'quiet', 'NO RECENT RIPPLES'));
      return;
    }
    bodyEl.append(el('h3', 'sec', 'RECENT RIPPLES'));
    for (const rp of d.ripples) {
      const row = el('div', 'obs');
      row.append(el('span', 'm', rp.symbol));
      const facts = [
        rp.zVol != null ? `zVol ${rp.zVol}` : null,
        rp.zRet != null ? `zRet ${rp.zRet}` : null,
        rp.extension != null ? `ext ${rp.extension}%` : null,
        agoStr(rp.ts),
      ].filter(Boolean).join(' · ');
      row.append(el('span', 'v', facts));
      bodyEl.append(row);
      if (rp.liquidityNote) bodyEl.append(el('div', 'quiet', rp.liquidityNote + (rp.inDeepTape ? ' · in deep tape' : '')));
    }
  } catch {
    bodyEl.replaceChildren(el('div', 'unavail', 'UNAVAILABLE — shell link lost'));
  }
}
$('#capUniverse').addEventListener('click', () => { if (!demo) openHuntCard(); });
$('#capEars').addEventListener('click', () => { if (!demo) openEarsCard(); });
$('#capEye').addEventListener('click', () => { if (!demo) openEyeCard(); });
/* ---------- UI-1B: the shared safe drawer shell ----------
   Opening shows the backdrop and arms ONE lightweight history entry (device
   Back closes the drawer instead of leaving Serpent). Closing is ALWAYS
   possible: 44px Close button, backdrop tap, Escape, Back, or a swipe down
   on the header. Closing an auth/CLEAR/VETO card merely cancels the UI —
   it never posts anything and can never authorize anything. */
let drawerPushed = false;
const anySheetOpen = () => $('#card').classList.contains('open') || $('#ledger').classList.contains('open');
function armDrawerHistory() {
  if (!drawerPushed && !anySheetOpen()) {
    try { history.pushState({ serpentDrawer: true }, ''); drawerPushed = true; } catch { /* history optional */ }
  }
}
function showCard({ kicker = '', title = '', coin = false } = {}) {
  armDrawerHistory();
  $('#cardKicker').textContent = kicker;
  if (title) $('#cardTitle').textContent = title;
  $('#card').classList.toggle('coin', coin);
  $('#card').classList.add('open');
  $('#backdrop').hidden = false;
}
function showLedger() {
  armDrawerHistory();
  $('#ledger').classList.add('open');
  $('#backdrop').hidden = false;
}
function closeSheets({ viaHistory = false } = {}) {
  $('#card').classList.remove('open');
  $('#ledger').classList.remove('open');
  $('#backdrop').hidden = true;
  if (drawerPushed && !viaHistory) {
    drawerPushed = false;
    try { history.back(); } catch { /* history optional */ }
  } else {
    drawerPushed = false;
  }
}
addEventListener('popstate', () => { if (anySheetOpen()) closeSheets({ viaHistory: true }); else drawerPushed = false; });
$('#cardClose').addEventListener('click', () => closeSheets());
$('#ledgerClose').addEventListener('click', () => closeSheets());
$('#backdrop').addEventListener('click', () => closeSheets()); // tap outside always exits
// taps INSIDE a drawer never dismiss it (the backdrop is a sibling behind)
addEventListener('keydown', (e) => { if (e.key === 'Escape' && anySheetOpen()) closeSheets(); });
// restrained swipe-down on the HEADER only — never fights body scrolling
for (const head of document.querySelectorAll('.dhead')) {
  let y0 = null;
  head.addEventListener('touchstart', (e) => { y0 = e.touches[0]?.clientY ?? null; }, { passive: true });
  head.addEventListener('touchmove', (e) => {
    if (y0 != null && (e.touches[0]?.clientY ?? 0) - y0 > 70) { y0 = null; closeSheets(); }
  }, { passive: true });
  head.addEventListener('touchend', () => { y0 = null; }, { passive: true });
}

/* ---------- demo mode: staged tour, sealed off from all real state ---------- */
const DEMO_SEQ = [
  ['COILED', 5000, { sub: 'NO TRADE', why: 'demo' }],
  ['STALKING', 6000, { sub: 'TARGET · SOL', why: 'demo — staged' }],
  ['STRIKE', 2600, { sub: 'TARGET · SOL', why: 'demo — staged' }],
  ['DIGESTING', 5200, { sub: 'HOLDING', why: 'demo — staged' }],
  ['RETREAT', 5000, { sub: '', why: 'demo — staged' }],
];
function demoStep() {
  const [posture, ms, opts] = DEMO_SEQ[demoIdx % DEMO_SEQ.length];
  demoTarget = (posture === 'STALKING' || posture === 'STRIKE') ? 'SOL' : null;
  applyPosture(posture, opts);
  demoIdx++;
  demoTimer = setTimeout(demoStep, ms);
}
function setDemo(on) {
  demo = on;
  body.classList.toggle('demo', on);
  clearTimeout(demoTimer); demoTimer = null; demoTarget = null; demoIdx = 0;
  closeSheets();
  if (on) { syncOrbit(majorsFallback(), null); demoStep(); } // staged tour uses the majors
  else if (lastStatus) { renderStatus(lastStatus); poll(); } // true state, immediately
  else poll();
}
/* UI-1: WATCHING is tappable — a single tap opens the Hunt drawer (what
   Serpent is watching, not what to buy). The triple-tap demo toggle stays:
   the drawer only opens once it's clear no more taps are coming. */
let taps = [];
let huntTapTimer = null;
$('#verdict').addEventListener('click', () => {
  const now = Date.now();
  taps = taps.filter((t) => now - t < 650); taps.push(now);
  clearTimeout(huntTapTimer);
  if (taps.length >= 3) { taps = []; setDemo(!demo); return; }
  huntTapTimer = setTimeout(() => { taps = []; if (!demo) openHuntCard(); }, 500);
});
$('#demobadge').addEventListener('click', () => setDemo(false));

/* ---------- reduced motion: driven by the system preference alone (UI-1A —
   no permanent cockpit button; information never depends on animation) */
function setReduced(on) { reduced = on; body.classList.toggle('reduced', on); }
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', (e) => setReduced(e.matches));

/* ---------- boot ---------- */
function endBoot() { body.classList.remove('booting'); }
$('#boot').addEventListener('click', endBoot);
setTimeout(endBoot, 1900);

/* ---------- main loop ---------- */
buildCoilRing();
seedStars();
syncOrbit(majorsFallback(), null); // quiet majors until real attention arrives
setReduced(reduced);
if (demo) setDemo(true);
addEventListener('resize', seedStars);
let lastFrameT = null;
function frame(t) {
  const dtMs = lastFrameT == null ? 16 : Math.min(100, t - lastFrameT); // tab-return safe
  lastFrameT = t;
  drawStars(t);
  layoutPlanets(t, dtMs);
  updateCoil(dtMs); // the animal moves — and watches the focal prey
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
poll();
setInterval(poll, 2500);
</script>
