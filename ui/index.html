<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpent</title>
<!-- UI-1: iPhone standalone presentation — installable, no URL-bar hacks -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serpent">
<meta name="theme-color" content="#030612">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* ============ deep space ============ */
  :root {
    --bg: #030612;
    --ink: #cfe3ea;
    --dim: #5c6b7a;
    --accent: #59e6c6;
    --accent2: #69d2ff;
    --vig: rgba(20, 60, 80, .22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    transition: background 1.2s ease;
  }
  /* posture = temperature */
  body[data-posture="STALKING"]  { --accent:#ffb454; --accent2:#ffd28a; --vig:rgba(255,150,40,.16); }
  body[data-posture="STRIKE"]    { --accent:#ff5b3c; --accent2:#ffa06b; --vig:rgba(255,70,40,.30); }
  body[data-posture="DIGESTING"] { --accent:#ff9e64; --accent2:#ffc99b; --vig:rgba(255,140,80,.12); }
  body[data-posture="RETREAT"]   { --accent:#8a94a6; --accent2:#a9b2c0; --vig:rgba(30,34,46,.45); }
  body[data-posture="RETREAT"] #scene { filter: saturate(.4) brightness(.82); }
  #scene { transition: filter 1.4s ease; }

  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 18vmax var(--vig);
    transition: box-shadow 1.4s ease;
  }
  #flash { position: fixed; inset: 0; background: #ff5b3c; opacity: 0; pointer-events: none; }
  #flash.hit { animation: flash .55s ease-out; }
  @keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }

  /* ============ core ============ */
  #scene { position: fixed; inset: 0; }
  #core {
    position: absolute; left: 50%; top: 46%;
    width: min(88vmin, 360px); height: min(88vmin, 360px);
    transform: translate(-50%, -50%);
  }
  /* UI-1: breathing is state-reactive — slowest at rest, tighter while
     stalking, quieted when caged, dormant under KILL. Real state only. */
  #ringGroup { animation: breathe var(--breath, 8s) ease-in-out infinite; transform-origin: center; }
  body[data-posture="STALKING"] { --breath: 4.6s; }
  body.caged { --breath: 13s; }
  body.caged #scene { filter: saturate(.62) brightness(.86); }
  body.killed #scene { filter: saturate(.22) brightness(.68); }
  body.killed #ringGroup, body.killed .ringPulse, body.killed #serpent .eye { animation: none; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  .ring    { fill: none; stroke: var(--accent); stroke-width: 1.6; opacity: .85;
             filter: drop-shadow(0 0 6px var(--accent)); transition: stroke 1.2s ease; }
  /* the coil made body-like: faint segment hint + a slow highlight moving
     through the ring — muscle, not sci-fi wire. Restrained on purpose. */
  .ringScales { fill: none; stroke: var(--accent); stroke-width: 3.1; opacity: .14;
                stroke-dasharray: 2.6 4.6; transition: stroke 1.2s ease; }
  .ringPulse  { fill: none; stroke: var(--accent2); stroke-width: 2.4; opacity: .38;
                stroke-dasharray: 46 607; stroke-linecap: round;
                filter: blur(1.1px) drop-shadow(0 0 5px var(--accent2));
                transform-origin: center; transition: stroke 1.2s ease; }
  body:not(.reduced) .ringPulse { animation: coilPulse 26s linear infinite; }
  @keyframes coilPulse { to { transform: rotate(360deg); } }
  body:not(.reduced) #serpent .eye { animation: eyeGlow 7s ease-in-out infinite; }
  @keyframes eyeGlow { 50% { opacity: .5; } }
  .arcBase { fill: none; stroke: #2a3547; stroke-width: 2; opacity: .55; }
  .arcFill { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round;
             filter: drop-shadow(0 0 4px var(--accent)); transition: stroke 1.2s ease; }
  .tick    { stroke: #62718a; stroke-width: 2; }
  .tick.hot { stroke: #ff7a5c; }
  .sess    { fill: none; stroke: #35435c; stroke-width: 1; opacity: .6; }
  .sessFill{ fill: none; stroke: var(--accent2); stroke-width: 1.4; stroke-linecap: round; opacity: .7;
             transition: stroke 1.2s ease; }
  #serpent path {
    fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round;
    opacity: .5; filter: drop-shadow(0 0 3px var(--accent)); transition: stroke 1.2s ease;
  }
  #serpent .eye { fill: var(--accent); stroke: none; opacity: .9; }
  #serpent { transform-origin: center; transition: transform 1.6s cubic-bezier(.4,0,.2,1); }
  body:not(.reduced) #serpent.idle { animation: coilTurn 90s linear infinite; }
  @keyframes coilTurn { to { transform: rotate(360deg); } }

  /* ============ verdict ============ */
  #verdict {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    text-align: center; width: 78vw; pointer-events: auto; cursor: default;
  }
  #verdict .word {
    font-size: clamp(26px, 8.4vw, 42px); font-weight: 700; letter-spacing: .14em;
    color: var(--accent); text-shadow: 0 0 18px var(--accent), 0 0 2px var(--accent);
    transition: color 1.2s ease, text-shadow 1.2s ease;
  }
  #verdict .sub {
    margin-top: 6px; font-size: clamp(12px, 3.4vw, 15px); letter-spacing: .3em;
    color: var(--ink); opacity: .85;
  }
  #verdict .why {
    margin-top: 8px; font-size: 11px; letter-spacing: .12em; color: var(--dim);
    text-transform: uppercase;
  }

  /* ============ planets ============ */
  .planet { position: absolute; left: 0; top: 0; width: 46px; height: 58px;
            margin: -23px 0 0 -23px; text-align: center; cursor: pointer; will-change: transform; }
  .planet .body {
    width: 30px; height: 30px; border-radius: 50%; margin: 0 auto;
    opacity: .82; transition: opacity .6s, box-shadow .6s;
  }
  .planet .lbl { margin-top: 5px; font-size: 10px; letter-spacing: .22em; color: var(--dim); }
  .planet.stalked .body { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  .planet.stalked .lbl { color: #ffb454; }
  /* UI-1: the CURRENT FOCUS — prey closest to the animal, larger and
     sharper, never covering the cobra. The animal stays the center. */
  .planet .body { transition: opacity .6s, box-shadow .6s, width .8s ease, height .8s ease; }
  .planet.focal .body { width: 38px; height: 38px; opacity: 1;
                        box-shadow: 0 0 16px 3px rgba(89,230,198,.30); }
  .planet.focal .lbl { color: var(--ink); font-weight: 600; letter-spacing: .26em; }
  /* real RUMINT nomination: a quiet amber dot, distinct from demo's full treatment */
  .planet .nomdot { display: none; width: 6px; height: 6px; border-radius: 50%;
                    background: #ffb454; box-shadow: 0 0 7px #ffb454; margin: 3px auto 0; }
  .planet.nominated .nomdot { display: block; }
  .planet.nominated .lbl { color: #ffb454; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 10px 1px rgba(255,180,84,.55); }
    50%     { box-shadow: 0 0 22px 6px rgba(255,180,84,.85); }
  }
  .reticle {
    position: absolute; left: 50%; top: 15px; width: 54px; height: 54px;
    transform: translate(-50%, -50%); display: none; pointer-events: none;
  }
  .planet.stalked .reticle { display: block; }
  body:not(.reduced) .planet.stalked .reticle { animation: retSpin 14s linear infinite; }
  @keyframes retSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ============ chips & chrome ============ */
  .chip {
    position: fixed; font-size: 11px; letter-spacing: .14em; color: var(--ink);
    background: rgba(8, 14, 28, .68); border: 1px solid #223048; border-radius: 20px;
    padding: 6px 12px; backdrop-filter: blur(4px); z-index: 30;
  }
  #tapechip { top: max(10px, env(safe-area-inset-top)); left: 12px; display: flex; gap: 7px; align-items: center; }
  #tapedot { width: 8px; height: 8px; border-radius: 50%; background: #3aa981; box-shadow: 0 0 8px #3aa981; }
  #tapedot.DEGRADED { background: #ffb454; box-shadow: 0 0 8px #ffb454; }
  #tapedot.OFFLINE, #tapedot.FROZEN, #tapedot.ABSENT, #tapedot.LOST { background: #56607a; box-shadow: none; }
  #clockchip { bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
               color: var(--dim); white-space: nowrap; }

  /* human controls: confirm-tap buttons. They only remove permission to trade. */
  #controls { position: fixed; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 40px);
              left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 35; }
  body.demo #controls { display: none; }
  #controls button {
    font-size: 11px; font-weight: 700; letter-spacing: .2em; padding: 8px 14px;
    border-radius: 20px; cursor: pointer; background: rgba(8,14,28,.75);
    backdrop-filter: blur(4px); transition: all .2s;
  }
  #btnKill  { color: #ff6b52; border: 1px solid #7c2f22; }
  #btnCage  { color: #ffb454; border: 1px solid #7a5526; }
  #btnVeto  { color: #69d2ff; border: 1px solid #2a5a78; }
  #btnClear { color: #9fb4c8; border: 1px solid #3a4a62; }
  #btnLedger { color: #7fc7de; border: 1px solid #2c4a5c; } /* neutral slate-cyan: display, not danger */
  #controls button.armed { color: #06090f; }
  #btnKill.armed  { background: #ff6b52; box-shadow: 0 0 16px rgba(255,107,82,.7); }
  #btnCage.armed  { background: #ffb454; box-shadow: 0 0 16px rgba(255,180,84,.7); }
  #btnClear.armed { background: #9fb4c8; }
  #controls button[hidden] { display: none; }
  #card .vrow { display: flex; justify-content: space-between; align-items: center;
                padding: 8px 4px; border-bottom: 1px solid #1c2942; font-size: 12px; }
  #card .vrow button { font-size: 10px; letter-spacing: .16em; padding: 5px 10px; border-radius: 14px;
                       color: #69d2ff; border: 1px solid #2a5a78; background: transparent; cursor: pointer; }
  #card .vrow button.armed { background: #69d2ff; color: #06090f; }
  #motion { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 40;
            background: rgba(8,14,28,.68); color: var(--dim); border: 1px solid #223048;
            border-radius: 20px; font-size: 11px; letter-spacing: .1em; padding: 6px 11px; cursor: pointer; }
  body.reduced #motion { color: var(--accent); border-color: var(--accent); }
  body.demo #motion { top: calc(max(10px, env(safe-area-inset-top)) + 88px); }
  body.reduced #ringGroup, body.reduced .planet.stalked .body { animation: none; }

  /* UI-1: tiny auth indicator (browser-side state only; server is the
     boundary). No giant pill over the serpent. */
  #authdot { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 40px); right: 12px; z-index: 40;
             width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
             background: rgba(8,14,28,.68); border: 1px solid #223048; color: var(--dim); cursor: pointer; }
  #authdot.authed { color: var(--accent); border-color: rgba(89,230,198,.55); }
  #authdot.warn { color: #ffb454; border-color: #7a5526; }
  body:not(.reduced) #authdot.warn { animation: authPulse 2.2s ease-in-out infinite; }
  @keyframes authPulse { 50% { box-shadow: 0 0 12px rgba(255,180,84,.6); } }
  #authwarn { top: calc(max(10px, env(safe-area-inset-top)) + 78px); right: 12px; left: auto; color: #ffb454;
              border-color: #7a5526; display: none; font-size: 9px; max-width: 46vw; text-align: right; }
  #authwarn.show { display: block; }

  /* UI-1: prey drawer sections + hunt drawer rows (all text set via
     textContent — external/social strings are DATA, never HTML) */
  #card h3.sec { margin-top: 13px; font-size: 10px; letter-spacing: .3em; color: var(--dim);
                 border-bottom: 1px solid #1c2942; padding-bottom: 4px; font-weight: 600; }
  #card .obs { font-size: 11.5px; color: var(--ink); padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
  #card .obs .m { color: var(--dim); flex: none; letter-spacing: .08em; }
  #card .obs .v { margin-left: auto; font-variant-numeric: tabular-nums; text-align: right; }
  #card .quiet { font-size: 11px; color: var(--dim); letter-spacing: .14em; padding: 6px 0; }
  #card .tierline { font-size: 12px; color: var(--accent); letter-spacing: .1em; padding: 5px 0; }

  /* UI-1: ledger performance console */
  #ledger .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  #ledger .kcard { border: 1px solid #22334c; border-radius: 10px; padding: 8px 10px; background: rgba(12,20,36,.5); }
  #ledger .kcard .k { font-size: 9px; letter-spacing: .22em; color: var(--dim); }
  #ledger .kcard .v { margin-top: 3px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #ledger .kcard .v small { font-size: 10px; font-weight: 400; color: var(--dim); }
  #ledger .reasons { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #ledger .reasons div { font-size: 9px; letter-spacing: .12em; padding: 3px 8px; border-radius: 10px;
                         border: 1px solid #22334c; color: var(--dim); }
  #ledger .trow { cursor: pointer; flex-wrap: wrap; }
  #ledger .trow .detail { flex-basis: 100%; color: var(--dim); font-size: 9.5px; letter-spacing: .06em;
                          padding-top: 3px; white-space: normal; }

  #demobadge {
    display: none; position: fixed; top: 46px; right: -34px; z-index: 50; cursor: pointer;
    transform: rotate(35deg); background: #b8860b; color: #0a0a05;
    font-size: 12px; font-weight: 700; letter-spacing: .28em; padding: 5px 44px;
    box-shadow: 0 0 14px rgba(255, 200, 60, .5);
  }
  body.demo #demobadge { display: block; }

  /* ============ detail card ============ */
  #card {
    position: fixed; left: 50%; bottom: -100%; transform: translateX(-50%);
    width: min(94vw, 420px); z-index: 60;
    background: rgba(8, 14, 28, .92); border: 1px solid #2a3a58; border-radius: 16px 16px 0 0;
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    transition: bottom .35s cubic-bezier(.3,.9,.3,1); backdrop-filter: blur(8px);
  }
  #card.open { bottom: 0; }
  #card h2 { font-size: 15px; letter-spacing: .3em; color: var(--accent); }
  #card .close { position: absolute; top: 10px; right: 14px; color: var(--dim); font-size: 18px; cursor: pointer; }
  #card .rows { margin-top: 10px; font-size: 13px; line-height: 1.9; }
  #card .rows b { color: var(--ink); font-weight: 600; float: right; font-variant-numeric: tabular-nums; }
  #card .rows span { color: var(--dim); letter-spacing: .08em; }
  #card .unavail { margin: 14px 0 6px; color: #ffb454; font-size: 13px; letter-spacing: .12em; }
  #card .depth { margin-top: 10px; }
  #card .drow { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dim); margin: 4px 0; }
  #card .drow .bar { height: 6px; border-radius: 3px; }
  #card .drow .bid { background: #2f9e77; margin-left: auto; }
  #card .drow .ask { background: #b0543f; }
  #card .drow .mid { width: 46px; text-align: center; letter-spacing: .1em; flex: none; }
  #card .demoNote { margin-top: 10px; font-size: 10px; color: #b8860b; letter-spacing: .14em; }

  /* ============ ledger panel (read-only; can never place or cancel anything) ============ */
  #ledger {
    position: fixed; left: 50%; bottom: -110%; transform: translateX(-50%);
    width: min(94vw, 430px); max-height: 80vh; overflow-y: auto; z-index: 70;
    background: rgba(7, 12, 24, .94); border: 1px solid #29394f; border-radius: 16px 16px 0 0;
    padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
    transition: bottom .35s cubic-bezier(.3,.9,.3,1); backdrop-filter: blur(10px);
  }
  #ledger.open { bottom: 0; }
  #ledger h2 { font-size: 13px; letter-spacing: .34em; color: #7fc7de; }
  #ledger .close { position: absolute; top: 10px; right: 14px; color: var(--dim); font-size: 18px; cursor: pointer; }
  #ledger .net { margin-top: 10px; font-size: clamp(20px, 6vw, 26px); font-weight: 700;
                 font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #ledger .net .pos, #ledger .trow .pos { color: #4fd598; }
  #ledger .net .neg, #ledger .trow .neg { color: #ff7a6b; }
  #ledger .line { margin-top: 6px; font-size: 12px; color: var(--ink); opacity: .85;
                  font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  #ledger .line span { color: var(--dim); }
  #ledger .trades { margin-top: 12px; border-top: 1px solid #1c2942; }
  #ledger .trow { display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
                  border-bottom: 1px solid #14203a; font-size: 11px;
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ledger .trow .t { color: var(--dim); width: 66px; flex: none; }
  #ledger .trow .sym { width: 44px; flex: none; font-weight: 600; }
  #ledger .trow .px { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #ledger .trow .net { margin: 0 0 0 auto; font-size: 11px; font-weight: 700; flex: none; }
  #ledger .trow .wl { width: 12px; flex: none; text-align: center; }
  #ledger .trow .rsn { color: var(--dim); font-size: 9px; letter-spacing: .08em; flex: none; }
  #ledger .symstrip { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #ledger .symstrip div { font-size: 10px; letter-spacing: .1em; padding: 4px 9px; border-radius: 12px;
                          border: 1px solid #22334c; color: var(--dim); font-variant-numeric: tabular-nums; }
  #ledger .fees { margin-top: 12px; font-size: 11px; letter-spacing: .18em; color: #c7a15a; }
  #ledger .empty { margin: 18px 0 8px; text-align: center; }
  #ledger .empty .big { font-size: 14px; letter-spacing: .18em; color: var(--ink); }
  #ledger .empty .sub { margin-top: 8px; font-size: 11px; color: var(--dim); letter-spacing: .12em; }
  #ledger .openpos { margin-top: 10px; border-top: 1px solid #1c2942; padding-top: 6px; }

  /* ============ boot ============ */
  #boot { position: fixed; inset: 0; background: #01030a; z-index: 100;
          display: flex; align-items: center; justify-content: center;
          transition: opacity .7s ease; }
  #boot span { color: #24445a; font-size: 12px; letter-spacing: .6em; animation: bootPulse 1.2s ease-in-out infinite; }
  @keyframes bootPulse { 50% { opacity: .35; } }
  body:not(.booting) #boot { opacity: 0; pointer-events: none; }
  body.booting #verdict, body.booting .planet { opacity: 0; }
  #verdict, .planet { transition: opacity 1s ease .2s; opacity: 1; }
  body.booting #serpent path.coil { stroke-dasharray: 2400; stroke-dashoffset: 2400; }
  #serpent path.coil { animation: drawCoil 1.5s ease .25s forwards; }
  @keyframes drawCoil { to { stroke-dashoffset: 0; } }
  body.reduced #serpent path.coil { animation: none; stroke-dasharray: none; }
#card input{width:100%;margin:8px 0;padding:10px;background:rgba(10,14,20,.9);border:1px solid #223;color:inherit;font:inherit;border-radius:6px}
</style>
</head>
<body class="booting" data-posture="COILED">

<canvas id="stars"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div id="scene">
  <svg id="core" viewBox="-170 -170 340 340" aria-hidden="true">
    <!-- ET session ring (outer, thin): progress through the trading day -->
    <circle class="sess" r="158"></circle>
    <path id="sessArc" class="sessFill" d=""></path>
    <!-- daily lock ring: 0..+11% sweep with ticks at +5/+8/+11 -->
    <g id="lockRing" style="display:none">
      <path id="lockBase" class="arcBase" d=""></path>
      <path id="lockFill" class="arcFill" d=""></path>
      <g id="lockTicks"></g>
    </g>
    <!-- the serpent, coiled about the verdict -->
    <g id="serpent" class="idle"></g>
    <!-- verdict ring — UI-1: layered so the coil feels like body, not wire.
         The main ring is a JS-built path with faint organic irregularity;
         ringScales hints at segments; ringPulse is a slow moving highlight. -->
    <g id="ringGroup">
      <path id="verdictRing" class="ring" d=""></path>
      <circle class="ringScales" r="104"></circle>
      <circle class="ringPulse" r="104"></circle>
    </g>
  </svg>
  <div id="verdict">
    <div class="word">WATCHING</div>
    <div class="sub">NO TRADE</div>
    <div class="why"></div>
  </div>
  <div id="planets"></div>
</div>

<div id="tapechip" class="chip"><div id="tapedot"></div><span id="tapetext">TAPE —</span></div>
<div id="universechip" class="chip" hidden
     style="top:calc(max(10px, env(safe-area-inset-top)) + 42px);left:12px;color:#5c6b7a"></div>
<div id="earschip" class="chip" hidden
     style="top:calc(max(10px, env(safe-area-inset-top)) + 74px);left:12px;color:#5c6b7a"></div>
<div id="eyechip" class="chip" hidden
     style="top:calc(max(10px, env(safe-area-inset-top)) + 106px);left:12px;color:#5c6b7a"></div>
<!-- UI-1: the tiny auth indicator. Browser-side state only — the security
     boundary stays on the server. No giant pill over the animal. -->
<button id="authdot" aria-label="control authentication status" title="control auth">
  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
    <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
    <path d="M8 10 V7 a4 4 0 0 1 8 0 v3" fill="none" stroke="currentColor" stroke-width="2"></path>

</button>

  <button id="btnCage">CAGE</button>

  <h2>LEDGER</h2>
  <div id="ledgerBody"></div>
</div>

  <h2 id="cardTitle">—</h2>
  <div id="cardBody"></div>
</div>

<div id="boot"><span>COBRA</span></div>

<script>
'use strict';
/* The shell displays. It never decides. Every number rendered as real data
   was read from disk by the server; anything else is dashes or UNAVAILABLE. */

const $ = (s) => document.querySelector(s);
const body = document.body;
const PLANET_STYLE = {
  BTC:  'radial-gradient(circle at 34% 30%, #ffd9a0, #f7931a 55%, #7a4507)',
  ETH:  'radial-gradient(circle at 34% 30%, #cdd2ff, #8a92ff 55%, #383e8f)',
  SOL:  'radial-gradient(circle at 34% 30%, #b9ffe9, #14f195 55%, #0b6a52)',
  XRP:  'radial-gradient(circle at 34% 30%, #bfe7ff, #25a4e8 55%, #114b6e)',
  DOGE: 'radial-gradient(circle at 34% 30%, #f4e6b8, #cba635 55%, #6b5312)',
};

/* ---------- state ---------- */
let universe = ['BTC', 'ETH', 'SOL', 'XRP', 'DOGE'];
let lastStatus = null;
let demo = new URLSearchParams(location.search).get('demo') === '1';
let demoTimer = null, demoIdx = 0, demoTarget = null;
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- starfield with Ophiuchus ---------- */
const canvas = $('#stars'), ctx = canvas.getContext('2d');
let stars = [], W = 0, H = 0;
// Ophiuchus, the serpent-bearer — its brightest stars, roughly placed.
// Nobody needs to notice. We'll know.
const OPHIUCHUS = [
  [.52,.08],[.66,.16],[.42,.22],[.72,.30],[.82,.40],[.18,.38],[.22,.44],[.38,.66],[.58,.62],[.68,.78],
];
function seedStars() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = [];
  const layers = [ [90, .35, .0016], [55, .8, .0038], [26, 1.3, .0075] ];
  for (const [n, r, v] of layers) {
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: r * (0.7 + Math.random() * 0.6),
                   v, a: 0.25 + Math.random() * 0.5, tw: Math.random() * Math.PI * 2 });
    }
  }
  // constellation stars: a touch brighter, upper field
  for (const [nx, ny] of OPHIUCHUS) {
    stars.push({ x: W * (0.18 + nx * 0.64), y: H * (0.04 + ny * 0.30), r: 1.7,
                 v: 0.0016, a: 0.85, tw: Math.random() * Math.PI * 2, oph: true });
  }
}
function drawStars(t) {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    if (!reduced) { s.x -= s.v; s.y += s.v * 0.35; if (s.x < -2) s.x = W + 2; if (s.y > H + 2) s.y = -2; }
    const tw = reduced ? 1 : (0.82 + 0.18 * Math.sin(t / 900 + s.tw));
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.oph ? '#cfe8ff' : '#9fb4c8';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- serpent glyph (spiral coiled around the verdict ring) ---------- */
function buildSerpent() {
  const pts = [];
  const turns = 2.6, a0 = -Math.PI / 2;
  for (let i = 0; i <= 220; i++) {
    const p = i / 220;
    const ang = a0 + p * turns * 2 * Math.PI;
    const r = 96 + p * 26 + Math.sin(p * 26) * 1.6; // organic wobble
    pts.push([(r * Math.cos(ang)).toFixed(1), (r * Math.sin(ang)).toFixed(1)]);
  }
  const d = 'M' + pts.map((p) => p.join(',')).join(' L');
  const [hx, hy] = pts[pts.length - 1].map(Number);
  const [px, py] = pts[pts.length - 4].map(Number);
  const angH = Math.atan2(hy - py, hx - px);
  const head = `M${hx},${hy} l${(7 * Math.cos(angH - 2.6)).toFixed(1)},${(7 * Math.sin(angH - 2.6)).toFixed(1)}
                M${hx},${hy} l${(7 * Math.cos(angH + 2.6)).toFixed(1)},${(7 * Math.sin(angH + 2.6)).toFixed(1)}`;
  $('#serpent').innerHTML =
    `<path class="coil" d="${d}"></path><path d="${head}"></path>` +
    `<circle class="eye" cx="${hx - 4 * Math.cos(angH)}" cy="${hy - 4 * Math.sin(angH)}" r="1.7"></circle>`;
  // UI-1: the verdict ring gets faint organic irregularity — a closed path
  // with a barely-perceptible radial wobble instead of a perfect circle.
  const rp = [];
  for (let i = 0; i <= 180; i++) {
    const a = (i / 180) * 2 * Math.PI;
    const r = 104 + Math.sin(a * 7 + 0.8) * 0.9 + Math.sin(a * 3 - 1.2) * 0.6;
    rp.push(`${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`);
  }
  $('#verdictRing').setAttribute('d', 'M' + rp.join(' L') + ' Z');
}

/* ---------- arcs (lock ring + ET session) ---------- */
const polar = (r, deg) => [r * Math.cos((deg - 90) * Math.PI / 180), r * Math.sin((deg - 90) * Math.PI / 180)];
function arcPath(r, fromDeg, toDeg) {
  const [x1, y1] = polar(r, fromDeg), [x2, y2] = polar(r, toDeg);
  const large = toDeg - fromDeg > 180 ? 1 : 0;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)}`;
}
const LOCK_R = 140, LOCK_FROM = -120, LOCK_SWEEP = 240; // 0..+11% maps onto 240°
function renderLockRing(locks) {
  const g = $('#lockRing');
  if (!locks) { g.style.display = 'none'; return; }
  g.style.display = '';
  $('#lockBase').setAttribute('d', arcPath(LOCK_R, LOCK_FROM, LOCK_FROM + LOCK_SWEEP));
  const th = locks.thresholds, hard = th.hardPct;
  const ticks = [th.selectivePct, th.protectPct, th.hardPct].map((pct) => {
    const deg = LOCK_FROM + (pct / hard) * LOCK_SWEEP;
    const [x1, y1] = polar(LOCK_R - 6, deg), [x2, y2] = polar(LOCK_R + 6, deg);
    const hot = locks.pnlPct >= pct ? ' hot' : '';
    return `<line class="tick${hot}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  });
  $('#lockTicks').innerHTML = ticks.join('');
  const frac = Math.max(0, Math.min(locks.pnlPct, hard)) / hard;
  $('#lockFill').setAttribute('d', frac > 0.004 ? arcPath(LOCK_R, LOCK_FROM, LOCK_FROM + frac * LOCK_SWEEP) : '');
}
function renderSession(sess) {
  if (!sess) return;
  $('#sessArc').setAttribute('d', sess.dayFraction > 0.003 ? arcPath(158, 0, sess.dayFraction * 359.9) : '');
  $('#clockchip').textContent = `ET ${sess.etTime} · SESSION ${sess.etDate}`;
}

/* ---------- planets: the hunting orbit (UI-1: dynamic display attention) ----------
   The orbit shows what Serpent is actually WATCHING (stalks, ripples,
   social attention) with the configured majors as quiet fallback. DISPLAY
   ATTENTION != BITEABLE — appearing here never implies eligibility.
   Symbols come from our own server, are strict tokens (validated), and are
   rendered as text only. Focus changes glide; the page never rebuilds. */
const SYM_RE = /^[A-Z0-9]{1,12}$/;
function planetStyle(coin) {
  if (PLANET_STYLE[coin]) return PLANET_STYLE[coin];
  let h = 0;
  for (const ch of coin) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `radial-gradient(circle at 34% 30%, hsl(${h} 82% 84%), hsl(${h} 72% 55%) 55%, hsl(${h} 60% 22%))`;
}
const planets = new Map();
let focusSymbol = null;
let lastAttention = null; // last good snapshot for the hunt drawer
let attentionAtMs = 0;
const ATTENTION_STALE_MS = 60_000; // stale focal prey never lingers (§37)
function makePlanet(coin) {
  const el = document.createElement('div');
  el.className = 'planet';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.innerHTML = `
    <svg class="reticle" viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#ffb454" stroke-width="1.4"
              stroke-dasharray="6 5" opacity=".9"></circle>
      <ellipse cx="30" cy="30" rx="2.2" ry="8" fill="#ffb454" opacity=".95"></ellipse>
    </svg>
    <div class="body" style="background:${planetStyle(coin)}"></div>
    <div class="lbl"></div>
    <div class="nomdot"></div>`;
  el.querySelector('.lbl').textContent = coin; // symbol is data, not markup
  el.addEventListener('click', () => openCard(coin));
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(coin); } });
  $('#planets').appendChild(el);
  const p = {
    el, coin,
    phase: Math.random() * Math.PI * 2,
    speed: 0.041 + (planets.size % 7) * 0.010,
    rank: planets.size, pull: 1.28, fade: 0, dying: false, meta: null,
  };
  planets.set(coin, p);
  return p;
}
// Reconcile displayed prey with the attention snapshot — additions drift in
// from the outside, departures fade out, focus docks on the inner coil.
function syncOrbit(list, focus) {
  const want = new Set();
  list.forEach((entry, i) => {
    if (!SYM_RE.test(entry.symbol)) return;
    want.add(entry.symbol);
    const p = planets.get(entry.symbol) ?? makePlanet(entry.symbol);
    p.meta = entry;
    p.rank = i;
    p.dying = false;
    const what = entry.tier === 1 ? 'active stalking' : entry.tier === 2 ? 'wide eye ripple'
      : entry.tier === 3 ? 'social attention' : 'watched major';
    p.el.setAttribute('aria-label', `${entry.symbol} — ${what} — tap for details`);
  });
  for (const p of planets.values()) if (!want.has(p.coin)) p.dying = true;
  focusSymbol = focus && SYM_RE.test(focus) ? focus : null;
}
function layoutPlanets(t) {
  const cx = innerWidth / 2, cy = innerHeight * 0.46;
  // keep the widest orbit + planet body inside the viewport edge
  const baseR = Math.min((innerWidth / 2 - 30) / 1.06, innerHeight * 0.36, 200);
  for (const [coin, p] of planets) {
    if (!reduced) p.phase += p.speed * 0.016;
    p.fade += ((p.dying ? 0 : 1) - p.fade) * (reduced ? 1 : 0.05);
    if (p.dying && p.fade < 0.03) { p.el.remove(); planets.delete(coin); continue; }
    const focal = !demo && coin === focusSymbol;
    const fac = 0.72 + p.rank * 0.075;
    // the focal prey docks ON the innermost hunting ring — closest to the
    // animal, never covering the verdict at the center
    const ringPx = Math.min(0.88 * Math.min(innerWidth, innerHeight), 360) * (104 / 340) + 12;
    const target = (demo && demoTarget === coin) ? 0.52
      : focal ? Math.min(1, Math.max(0.4, ringPx / (baseR * fac))) : 1;
    p.pull += (target - p.pull) * (reduced ? 1 : 0.04);
    const rx = baseR * fac * p.pull;
    const x = cx + rx * Math.cos(p.phase);
    const y = cy + rx * 0.55 * Math.sin(p.phase);
    const depth = (Math.sin(p.phase) + 1) / 2;            // 0 back, 1 front
    const sc = (0.82 + depth * 0.3) * (focal ? 1.12 : 1);
    p.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${sc.toFixed(3)})`;
    p.el.style.zIndex = String(10 + Math.round(depth * 9) + (focal ? 5 : 0));
    p.el.style.opacity = ((0.62 + depth * 0.38) * p.fade).toFixed(2);
    p.el.classList.toggle('stalked', (demo && demoTarget === coin) || (!demo && p.meta?.tier === 1));
    p.el.classList.toggle('focal', focal);
    p.el.classList.toggle('nominated', !demo && p.meta?.tier === 3);
  }
}
// §37: attention arriving is truth; attention failing falls back to the
// configured majors — nothing invented, nothing stale left focal forever.
function majorsFallback() {
  return universe.map((symbol) => ({ symbol, tier: 4, fallback: true, reason: 'configured major — quiet fallback' }));
}
function applyAttention(a) {
  if (a && Array.isArray(a.orbit)) {
    lastAttention = a;
    attentionAtMs = Date.now();
    syncOrbit(a.orbit, a.focus?.symbol ?? null);
    return;
  }
  if (Date.now() - attentionAtMs > ATTENTION_STALE_MS) {
    lastAttention = null;
    syncOrbit(majorsFallback(), null);
  }
}

/* ---------- verdict / posture rendering ---------- */
const WORDS = {
  COILED:    { word: 'WATCHING',      sub: 'NO TRADE' },
  STALKING:  { word: 'STALKING',      sub: '' },
  STRIKE:    { word: 'STRIKE',        sub: '' },
  DIGESTING: { word: 'DIGESTING',     sub: 'HOLDING' },
  RETREAT:   { word: 'STANDING DOWN', sub: '' },
};
function applyPosture(posture, { why = '', sub = null } = {}) {
  const prev = body.dataset.posture;
  body.dataset.posture = posture;
  const w = WORDS[posture] || WORDS.COILED;
  $('#verdict .word').textContent = w.word;
  $('#verdict .sub').textContent = sub ?? w.sub;
  $('#verdict .why').textContent = why;
  if (posture === 'STRIKE' && prev !== 'STRIKE' && !reduced) {
    const f = $('#flash'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
  }
  // the serpent leans toward the hunt; at rest it simply turns
  const serp = $('#serpent');
  if (demo && demoTarget && (posture === 'STALKING' || posture === 'STRIKE')) {
    const p = planets.get(demoTarget);
    const deg = p ? (p.phase * 180 / Math.PI) : 0;
    serp.classList.remove('idle');
    serp.style.transform = `rotate(${(deg + 90).toFixed(0)}deg) scale(1.05)`;
  } else {
    serp.style.transform = ''; serp.classList.add('idle');
  }
}

/* ---------- real status ---------- */
/* ---------- CONTROL-0: the interface is not authority ---------- */
/* csrfToken lives only in this page's memory — never localStorage, never a
   query string. The session rides an HttpOnly SameSite=Strict cookie the
   script cannot read. The server re-authorizes every mutation. */
let csrfToken = null;
/* UI-1: the auth indicator is a tiny glyph, not an overlay pill. Ordinary
   locked = quiet dim padlock; authenticated = accent; a REAL problem
   (unconfigured/error) = compact amber warning that demands attention. */
function renderAuthDot(state) {
  const dot = $('#authdot');
  dot.classList.toggle('authed', state === 'authed');
  dot.classList.toggle('warn', state === 'warn');
  dot.setAttribute('aria-label',
    state === 'authed' ? 'control authenticated'
    : state === 'warn' ? 'control auth unavailable — attention required'
    : 'control locked — tap to authenticate');
  $('#authwarn').classList.toggle('show', state === 'warn');
}
async function refreshAuth() {
  try {
    const r = await fetch('/api/auth/status');
    const d = await r.json();
    csrfToken = d.authenticated ? d.csrfToken : null;
    renderAuthDot(d.controlAuth === 'CONTROL_AUTH_UNCONFIGURED' ? 'warn' : d.authenticated ? 'authed' : 'locked');
  } catch {
    renderAuthDot('warn'); // an auth endpoint we cannot read is a real problem
  }
}
$('#authdot').addEventListener('click', () => { if (!csrfToken) openAuthCard(); });
function openAuthCard(then) {
  $('#cardTitle').textContent = 'CONTROL AUTH';
  $('#cardBody').innerHTML = `
    <div class="rows"><span>server authorization required</span></div>
    <input id="authPw" type="password" placeholder="control password" autocomplete="current-password">
    <button id="authGo">AUTHENTICATE</button>
    <div id="authMsg" class="rows"></div>`;
  $('#authGo').addEventListener('click', async () => {
    const pw = $('#authPw').value;
    $('#authPw').value = '';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const d = await r.json();
      if (d.authenticated) {
        csrfToken = d.csrfToken;
        $('#card').classList.remove('open');
        refreshAuth();
        if (then) then();
      } else {
        $('#authMsg').textContent =
          d.reason === 'RATE_LIMITED' ? `LOCKED OUT — retry in ${d.retryAfterSec ?? '?'}s`
          : d.reason === 'CONTROL_AUTH_UNCONFIGURED' ? 'CONTROL AUTH UNCONFIGURED'
          : 'AUTHENTICATION FAILED';
      }
    } catch { $('#authMsg').textContent = 'SHELL LINK LOST'; }
  });
  $('#card').classList.add('open');
}
function ensureAuth(fire) { if (csrfToken) fire(); else openAuthCard(fire); }
function openClearCard() {
  $('#cardTitle').textContent = 'CLEAR / RE-ARM';
  $('#cardBody').innerHTML = `
    <div class="rows"><span>restoring permission requires fresh intent — password again, and the exact phrase</span></div>
    <input id="clrPw" type="password" placeholder="control password" autocomplete="off">
    <input id="clrPhrase" type="text" placeholder="type: CLEAR SERPENT" autocomplete="off" autocapitalize="characters">
    <button id="clrGo">CLEAR</button>
    <div id="clrMsg" class="rows"></div>`;
  $('#clrGo').addEventListener('click', async () => {
    const password = $('#clrPw').value;
    const confirmPhrase = $('#clrPhrase').value;
    $('#clrPw').value = '';
    const d = await postControl('clear', { password, confirmPhrase });
    if (d.ok) $('#card').classList.remove('open');
    else $('#clrMsg').textContent =
      d.reason === 'RATE_LIMITED' ? `LOCKED OUT — retry in ${d.retryAfterSec ?? '?'}s`
      : d.reason === 'UNAUTHENTICATED' ? 'AUTHENTICATE FIRST'
      : 'CLEAR REFUSED';
  });
  $('#card').classList.add('open');
}
refreshAuth();
setInterval(refreshAuth, 60_000);
/* ---------- human controls: confirm-tap, POST, honest feedback ---------- */
const armTimers = new Map();
function armThen(btn, label, fire) {
  if (btn.classList.contains('armed')) {
    clearTimeout(armTimers.get(btn));
    btn.classList.remove('armed');
    btn.textContent = label;
    fire();
    return;
  }
  btn.classList.add('armed');
  btn.textContent = 'CONFIRM?';
  armTimers.set(btn, setTimeout(() => {
    btn.classList.remove('armed');
    btn.textContent = label;
  }, 3000));
}
async function postControl(action, extra = {}) {
  try {
    const r = await fetch('/api/control', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(csrfToken ? { 'X-Serpent-CSRF': csrfToken } : {}) },
      body: JSON.stringify({ action, ...extra }),
    });
    const d = await r.json();
    if (r.status === 401) { csrfToken = null; refreshAuth(); }
    if (d.ok && d.status) renderStatus(d.status);
    return d;
  } catch {
    $('#tapetext').textContent = 'SHELL LINK LOST';
    return { ok: false };
  }
}
$('#btnKill').addEventListener('click', () => armThen($('#btnKill'), 'KILL', () => ensureAuth(() => postControl('kill'))));
$('#btnCage').addEventListener('click', () => armThen($('#btnCage'), 'CAGE', () => ensureAuth(() => postControl('cage'))));
$('#btnClear').addEventListener('click', () => ensureAuth(openClearCard));
$('#btnVeto').addEventListener('click', () => openVetoSheet());

function openVetoSheet() {
  const pending = lastStatus?.pendingStrikes ?? [];
  $('#cardTitle').textContent = 'VETO';
  $('#cardBody').innerHTML = pending.length
    ? pending.map((p) => `
        <div class="vrow"><span>${p.coin} · $${p.sizeUsd} · <span style="color:var(--dim)">${p.id.slice(0, 8)}…</span></span>
        <button data-veto="${p.id}">VETO</button></div>`).join('')
    : '<div class="rows"><span>no pending strikes to deny</span></div>';
  for (const b of $('#cardBody').querySelectorAll('[data-veto]')) {
    b.addEventListener('click', () =>
      armThen(b, 'VETO', () => ensureAuth(async () => {
        await postControl('veto', { predictionId: b.dataset.veto });
        openVetoSheet(); // re-render the remaining pending list
      }))
    );
  }
  $('#card').classList.add('open');
}

/* ---------- ledger panel: read-only mirror of the paper ledger ---------- */
const fmt$ = (v) => (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
const fmtPct = (v) => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
const cls = (v) => (v >= 0 ? 'pos' : 'neg');
function renderLedger(L) {
  const b = $('#ledgerBody');
  if (!L) { b.innerHTML = '<div class="line"><span>ledger unreadable — shell link lost</span></div>'; return; }
  if (L.totalTrades === 0 && !L.openPositions.length) {
    b.innerHTML = `
      <div class="net">$${L.startingBalance.toFixed(2)} <span style="color:var(--dim)">— untouched</span></div>
      <div class="empty">
        <div class="big">NO STRIKES YET</div>
        <div class="sub">the snake declines bad meals</div>
        <div class="sub">ON WATCH · ${L.daysOnWatch} SESSION${L.daysOnWatch === 1 ? '' : 'S'}</div>
      </div>`;
    return;
  }
  // UI-1 performance console — every figure from existing ledger records.
  const holdStr = (m) => (m == null ? null : m < 90 ? `${Math.round(m)}m` : `${(m / 60).toFixed(1)}h`);
  const rows = L.lastTrades.map((t, i) => `
    <div class="trow" data-trade="${i}">
      <span class="t">${t.etTime}</span>
      <span class="sym">${t.symbol}</span>
      <span class="px">$${t.sizeUsd} · ${t.entry.toPrecision(6)}→${t.exit.toPrecision(6)}</span>
      <span class="net ${cls(t.netUsd)}">${fmt$(t.netUsd)}${t.netPct != null ? ` <small style="font-weight:400">${fmtPct(t.netPct)}</small>` : ''}</span>
      <span class="wl ${cls(t.netUsd)}">${t.result}</span>
      <span class="rsn">${t.exitReason}${t.holdMin != null ? ` · ${holdStr(t.holdMin)}` : ''}</span>
    </div>`).join('');
  const syms = Object.entries(L.perSymbol).map(([sym, p]) =>
    `<div>${sym} · ${p.trades} · <span class="${cls(p.netUsd)}" style="color:${p.netUsd >= 0 ? '#4fd598' : '#ff7a6b'}">${fmt$(p.netUsd)}</span></div>`).join('');
  const openRows = L.openPositions.map((p) => `
    <div class="trow">
      <span class="sym">${p.symbol}</span>
      <span class="px">OPEN · $${p.sizeUsd} @ ${p.entry.toPrecision(6)}${p.entryFeeUsd != null ? ` · fee ${fmt$(p.entryFeeUsd)}` : ''}${p.ageMin != null ? ` · ${holdStr(p.ageMin)}` : ''}</span>
      <span class="net ${p.unrealizedUsd == null ? '' : cls(p.unrealizedUsd)}">${p.unrealizedUsd == null ? 'UNAVAILABLE' : fmt$(p.unrealizedUsd)}</span>
    </div>`).join('');
  const card = (k, v) => `<div class="kcard"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const cards = [
    card('REALIZED BALANCE', `$${L.currentBalance.toFixed(2)}`),
    card('TOTAL NET P&amp;L', `<span class="${cls(L.netPnl.usd)}">${fmt$(L.netPnl.usd)}</span> <small>${fmtPct(L.netPnl.pct)}</small>`),
    card('TODAY', `<span class="${cls(L.todayPnl.usd)}">${fmt$(L.todayPnl.usd)}</span> <small>${fmtPct(L.todayPnl.pct)}</small>`),
    card('CLOSED TRADES', `${L.totalTrades} <small>${L.wins}W–${L.losses}L</small>`),
    card('WIN RATE', L.winRatePct != null ? `${L.winRatePct.toFixed(0)}%` : '—'),
    card('PROFIT FACTOR', L.profitFactor != null ? L.profitFactor.toFixed(2) : 'N/A'),
    card('TOTAL FEES', fmt$(L.totalFeesPaid)),
    card('OPEN / PENDING', `${L.openPositions.length} <small>open</small> ${L.pendingPredictions} <small>pending</small>`),
  ].join('');
  const stats = [
    L.avgWinUsd != null ? `avg W <b>${fmt$(L.avgWinUsd)}</b>` : null,
    L.avgLossUsd != null ? `avg L <b>${fmt$(L.avgLossUsd)}</b>` : null,
    L.avgNetPerClosedUsd != null ? `avg net <b>${fmt$(L.avgNetPerClosedUsd)}</b>` : null,
    L.largestWinUsd != null ? `best <b>${fmt$(L.largestWinUsd)}</b>` : null,
    L.largestLossUsd != null ? `worst <b>${fmt$(L.largestLossUsd)}</b>` : null,
  ].filter(Boolean).join(' <span>·</span> ');
  const reasons = Object.entries(L.exitReasons ?? {}).map(([r, n]) => `<div>${r} × ${n}</div>`).join('');
  b.innerHTML = `
    <div class="net">$${L.startingBalance.toFixed(2)} → $${L.currentBalance.toFixed(2)}
      <span class="${cls(L.netPnl.usd)}">· ${fmtPct(L.netPnl.pct)}</span></div>
    <div class="cards">${cards}</div>
    ${stats ? `<div class="line">${stats}</div>` : ''}
    ${reasons ? `<div class="reasons">${reasons}</div>` : ''}
    ${openRows ? `<div class="openpos">${openRows}</div>` : ''}
    <div class="trades">${rows}</div>
    ${syms ? `<div class="symstrip">${syms}</div>` : ''}
    <div class="fees">COSTS PAID ${fmt$(L.totalFeesPaid)}</div>`;
  // tap a closed trade for its prediction → entry → exit lifecycle line
  for (const rowEl of b.querySelectorAll('[data-trade]')) {
    rowEl.addEventListener('click', () => {
      const t = L.lastTrades[Number(rowEl.dataset.trade)];
      const existing = rowEl.querySelector('.detail');
      if (existing) { existing.remove(); return; }
      const d = document.createElement('div');
      d.className = 'detail';
      d.textContent = `prediction ${t.prediction_id} · entered ${t.entryTs ?? '—'} · exited ${t.exitTs} · fees ${fmt$(t.feesUsd)}${t.holdMin != null ? ` · held ${holdStr(t.holdMin)}` : ''}`;
      rowEl.appendChild(d);
    });
  }
}
function ledgerError(msg) {
  $('#ledgerBody').innerHTML = `<div class="line"><span>${msg}</span></div>`;
}
async function refreshLedger() {
  // Distinguish the failure classes instead of swallowing them: the real
  // error goes to the console (and thus VM logs), the panel names the class.
  let res;
  try {
    res = await fetch('/api/ledger/summary', { cache: 'no-store' });
  } catch (err) {
    console.error('LEDGER fetch failed (server unreachable):', err);
    return ledgerError('SHELL LINK LOST — server unreachable');
  }
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    console.error(`LEDGER HTTP ${res.status}:`, body.slice(0, 300));
    return ledgerError(`LEDGER ERROR — HTTP ${res.status}${res.status === 404 ? ' (deployed build predates the ledger — redeploy)' : ''}`);
  }
  let data;
  try {
    data = await res.json();
  } catch (err) {
    console.error('LEDGER bad JSON:', err);
    return ledgerError('LEDGER ERROR — bad response (stale build?)');
  }
  try {
    renderLedger(data);
  } catch (err) {
    console.error('LEDGER render error:', err, data);
    ledgerError('LEDGER RENDER ERROR — see console');
  }
}
$('#btnLedger').addEventListener('click', () => { $('#ledger').classList.add('open'); refreshLedger(); });
$('#ledger .close').addEventListener('click', () => $('#ledger').classList.remove('open'));

function renderStatus(s) {
  lastStatus = s;
  if (Array.isArray(s.universe) && s.universe.length) universe = s.universe; // fallback majors
  // the animal's quiet: KILL = dormant, CAGE = restrained (real state only)
  body.classList.toggle('killed', Boolean(s.controls?.kill));
  body.classList.toggle('caged', Boolean(s.controls?.cage) && !s.controls?.kill);
  const latched = s.controls && (s.controls.kill || s.controls.cage);
  $('#btnClear').hidden = !latched;
  $('#btnKill').hidden = Boolean(s.controls?.kill);
  $('#btnCage').hidden = Boolean(s.controls?.cage);
  $('#btnVeto').hidden = !(s.pendingStrikes && s.pendingStrikes.length);
  if (!demo) {
    const why = s.posture === 'RETREAT' ? s.retreatCauses.map((c) => c.key).join(' · ') : (s.advisories[0] || '');
    const sub = s.posture === 'STALKING' && s.stalking?.length ? s.stalking.join(' · ') : null;
    applyPosture(s.posture, { why, ...(sub ? { sub } : {}) });
  }
  const r = s.rumint;
  $('#earschip').hidden = !(r && r.enabled && r.fresh);
  if (r && r.enabled && r.fresh) {
    $('#earschip').textContent = r.backoff
      ? 'EARS BACK-OFF'
      : `EARS ON · ${r.symbolsPolled}` + (r.hyped?.length ? ` · HYPED ${r.hyped.length}` : '');
  }
  const t = s.tape;
  const dot = $('#tapedot'); dot.className = ''; dot.classList.add(t.effective);
  const age = t.ageSec != null ? ` · ${t.ageSec < 99 ? t.ageSec.toFixed(1) : Math.round(t.ageSec)}s` : '';
  const label = { LIVE: 'TAPE LIVE', DEGRADED: 'TAPE DEGRADED', OFFLINE: 'TAPE OFFLINE',
                  FROZEN: 'TAPE FROZEN', ABSENT: 'NO TAPE' }[t.effective] || 'TAPE ?';
  $('#tapetext').textContent = label + (t.effective === 'LIVE' ? age : '');
  const u = t.universe;
  $('#universechip').hidden = !u;
  if (u) {
    const off = (u.stale ?? 0) + (u.unavailable ?? 0);
    $('#universechip').textContent = `UNIVERSE ${u.total} · LIVE ${u.live}` + (off ? ` · OFF ${off}` : '');
  }
  const w = s.wideeye;
  $('#eyechip').hidden = !(w && w.enabled && w.fresh);
  if (w && w.enabled && w.fresh) {
    $('#eyechip').textContent = `WIDE EYE ${w.scanned} scanned · ${w.ripplesToday} ripple${w.ripplesToday === 1 ? '' : 's'} today`;
  }
  renderLockRing(s.locks);
  renderSession(s.session);
}
async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    renderStatus(s);
    if ($('#ledger').classList.contains('open')) refreshLedger(); // piggyback, no extra loop
  } catch {
    const dot = $('#tapedot'); dot.className = ''; dot.classList.add('LOST');
    $('#tapetext').textContent = 'SHELL LINK LOST';
  }
  // display attention rides the SAME cadence — no extra polling loop; a
  // failure falls back to the configured majors, never a broken screen
  if (!demo) {
    try {
      applyAttention(await (await fetch('/api/attention', { cache: 'no-store' })).json());
    } catch {
      applyAttention(null);
    }
  }
}

/* ---------- detail card (real data only, or UNAVAILABLE, or demo dashes) ----------
   UI-1: "WHY AM I WATCHING THIS?" — four compact sections. Every dynamic
   string (stalk causes, social text, reasons) is DATA rendered via
   textContent; external text can never become HTML or instruction. */
function fmtUsd(v) { return v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'k' : '$' + v.toFixed(0); }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text); // safe by construction
  return n;
}
function obsRow(label, value) {
  const d = el('div', 'obs');
  d.append(el('span', 'm', label), el('span', 'v', value));
  return d;
}
function agoStr(ts) {
  const ms = Date.now() - (typeof ts === 'string' ? Date.parse(ts) : ts);
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const m = ms / 60_000;
  if (m < 1) return 'just now';
  if (m < 90) return `${Math.round(m)}m ago`;
  return `${(m / 60).toFixed(1)}h ago`;
}
function renderAttractionSection(bodyEl, att) {
  bodyEl.append(el('h3', 'sec', 'ATTRACTION'));
  if (att?.stalking) {
    bodyEl.append(el('div', 'tierline', 'ACTIVE STALK'));
    bodyEl.append(obsRow('cause', att.stalking.reason));
    if (att.stalking.since) bodyEl.append(obsRow('first seen', agoStr(att.stalking.since)));
    if (att.stalking.expiresMs) {
      const left = Math.max(0, (att.stalking.expiresMs - Date.now()) / 60_000);
      bodyEl.append(obsRow('expires', `${Math.round(left)}m`));
    }
  } else if (att?.wideEye) {
    bodyEl.append(el('div', 'tierline', 'WIDE EYE RIPPLE'));
    if (att.wideEye.zVol != null) bodyEl.append(obsRow('volume z', att.wideEye.zVol));
    if (att.wideEye.zRet != null) bodyEl.append(obsRow('return z', att.wideEye.zRet));
    if (att.wideEye.extension != null) bodyEl.append(obsRow('extension', `${att.wideEye.extension}%`));
    bodyEl.append(obsRow('observed', agoStr(att.wideEye.ts)));
  } else if (att?.rumint?.nomination || att?.rumint?.hyped) {
    bodyEl.append(el('div', 'tierline', 'SOCIAL ATTENTION'));
    if (att.rumint.nomination) {
      bodyEl.append(obsRow('cause', att.rumint.nomination.reason));
      bodyEl.append(obsRow('observed', agoStr(att.rumint.nomination.ts)));
    }
    if (att.rumint.hyped) bodyEl.append(obsRow('status', 'HYPED'));
  } else {
    bodyEl.append(el('div', 'quiet', 'NO CURRENT ATTENTION — QUIET WATCH'));
  }
}
function renderSocialSection(bodyEl, rumint) {
  bodyEl.append(el('h3', 'sec', 'SOCIAL / RUMORS'));
  const sig = rumint?.signal;
  if (!sig && !rumint?.hyped && !rumint?.nomination) {
    bodyEl.append(el('div', 'quiet', 'NO MEANINGFUL SOCIAL SIGNAL'));
    return;
  }
  if (sig) {
    bodyEl.append(obsRow('chatter velocity', sig.velocity != null ? `${sig.velocity}/hr` : 'UNAVAILABLE'));
    bodyEl.append(obsRow('velocity z', sig.zVelocity != null ? sig.zVelocity.toFixed(2) : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('acceleration', sig.acceleration != null ? sig.acceleration : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('sentiment shift', sig.sentimentShift != null ? sig.sentimentShift.toFixed(2) : 'INSUFFICIENT HISTORY'));
    bodyEl.append(obsRow('source', sig.source ?? 'RUMINT'));
  }
  if (rumint?.hyped) bodyEl.append(obsRow('today', 'HYPED'));
}
function renderMarketSection(bodyEl, d) {
  bodyEl.append(el('h3', 'sec', 'MARKET'));
  if (!d.available) {
    bodyEl.append(el('div', 'quiet', d.reason || 'UNAVAILABLE — NO TRADE'));
    return;
  }
  const rows = el('div', 'rows');
  const mk = (label, val) => { const r = el('div'); r.append(el('span', null, label), el('b', null, val)); return r; };
  rows.append(
    mk('MID', d.mid.toLocaleString('en-US', { maximumFractionDigits: 6 })),
    mk('BID / ASK', `${d.bestBid} / ${d.bestAsk}`),
    mk('SPREAD', `${d.spreadBps.toFixed(2)} bps`),
    mk('BOOK AGE', `${d.ageSec.toFixed(1)} s`),
    mk('LEVELS', `${d.levels.bids} bid / ${d.levels.asks} ask`)
  );
  bodyEl.append(rows);
  const bands = ['5bps', '10bps', '25bps'];
  const maxD = Math.max(...bands.flatMap((b) => [d.depthUsd[b].bid, d.depthUsd[b].ask]));
  const depth = el('div', 'depth');
  for (const b of bands) {
    const row = el('div', 'drow');
    const bidLbl = el('span', null, fmtUsd(d.depthUsd[b].bid)); bidLbl.style.cssText = 'width:74px;text-align:right';
    const bid = el('div', 'bar bid'); bid.style.width = `${Math.max(3, (d.depthUsd[b].bid / maxD) * 92)}px`;
    const ask = el('div', 'bar ask'); ask.style.width = `${Math.max(3, (d.depthUsd[b].ask / maxD) * 92)}px`;
    const askLbl = el('span', null, fmtUsd(d.depthUsd[b].ask)); askLbl.style.width = '74px';
    row.append(bidLbl, bid, el('div', 'mid', `±${b.replace('bps', '')}bp`), ask, askLbl);
    depth.append(row);
  }
  bodyEl.append(depth);
}
function renderMemorySection(bodyEl, memory) {
  bodyEl.append(el('h3', 'sec', 'MEMORY'));
  const records = memory?.records ?? [];
  if (!records.length) {
    bodyEl.append(el('div', 'quiet', memory?.meta?.mode === 'LOCAL_ONLY' ? 'LOCAL SESSION MEMORY ONLY — NOTHING RECENT' : 'NO RECENT MEMORY'));
    return;
  }
  for (const rec of [...records].reverse()) {
    const row = el('div', 'obs');
    row.append(el('span', 'm', `${rec.sourceModule} · ${rec.eventType}`));
    row.append(el('span', 'v', `${rec.observationState} · ${agoStr(rec.ts * 1000)}`));
    bodyEl.append(row);
  }
}
async function openCard(coin) {
  $('#cardTitle').textContent = coin;
  const bodyEl = $('#cardBody');
  if (demo) {
    bodyEl.replaceChildren();
    const rows = el('div', 'rows');
    for (const k of ['PRICE', 'SPREAD', 'BOOK AGE', 'DEPTH']) {
      const r = el('div'); r.append(el('span', null, k), el('b', null, '—')); rows.append(r);
    }
    bodyEl.append(rows, el('div', 'demoNote', 'DEMO — STAGED VISUALS. THESE ARE NOT MARKET VALUES.'));
    $('#card').classList.add('open');
    return;
  }
  bodyEl.replaceChildren(el('div', 'quiet', 'reading tape…'));
  $('#card').classList.add('open');
  try {
    const d = await (await fetch('/api/coin/' + encodeURIComponent(coin), { cache: 'no-store' })).json();
    bodyEl.replaceChildren();
    bodyEl.append(el('div', 'quiet', 'WHY AM I WATCHING THIS?'));
    renderAttractionSection(bodyEl, d.attention);
    renderSocialSection(bodyEl, d.attention?.rumint);
    renderMarketSection(bodyEl, d);
    renderMemorySection(bodyEl, d.memory);
  } catch {
    bodyEl.replaceChildren(el('div', 'unavail', 'UNAVAILABLE — shell link lost'));
  }
}

/* ---------- Hunt drawer: WHAT SERPENT IS WATCHING (never a buy list) ---------- */
function openHuntCard() {
  $('#cardTitle').textContent = 'WATCHING';
  const bodyEl = $('#cardBody');
  bodyEl.replaceChildren();
  const a = lastAttention;
  const tierWord = (t) => (t === 1 ? 'active stalk' : t === 2 ? 'wide eye ripple' : t === 3 ? 'social attention' : 'quiet fallback');
  if (a?.focus) {
    bodyEl.append(el('h3', 'sec', 'FOCUS'));
    bodyEl.append(el('div', 'tierline', a.focus.symbol));
    bodyEl.append(obsRow(tierWord(a.focus.tier), a.focus.reason));
    if (a.focus.ts) bodyEl.append(obsRow('refreshed', agoStr(a.focus.ts)));
  } else {
    bodyEl.append(el('div', 'quiet', 'NO CURRENT FOCUS — WATCHING THE MAJORS'));
  }
  const others = (a?.orbit ?? []).filter((e) => !e.fallback && e.symbol !== a?.focus?.symbol);
  if (others.length) {
    bodyEl.append(el('h3', 'sec', 'OTHER ATTENTION'));
    for (const e of others) {
      const row = el('div', 'obs');
      row.append(el('span', 'm', e.symbol));
      row.append(el('span', 'v', `${tierWord(e.tier)} · ${e.ts ? agoStr(e.ts) : '—'}`));
      bodyEl.append(row);
    }
  }
  bodyEl.append(el('div', 'quiet', 'WHAT SERPENT IS WATCHING — NOT ADVICE, NOT ELIGIBILITY'));
  $('#card').classList.add('open');
}
$('#card .close').addEventListener('click', () => $('#card').classList.remove('open'));
$('#scene').addEventListener('click', (e) => {
  if (!e.target.closest('.planet') && !e.target.closest('#card')) $('#card').classList.remove('open');
  if (!e.target.closest('#ledger')) $('#ledger').classList.remove('open');
});

/* ---------- demo mode: staged tour, sealed off from all real state ---------- */
const DEMO_SEQ = [
  ['COILED', 5000, { sub: 'NO TRADE', why: 'demo' }],
  ['STALKING', 6000, { sub: 'TARGET · SOL', why: 'demo — staged' }],
  ['STRIKE', 2600, { sub: 'TARGET · SOL', why: 'demo — staged' }],
  ['DIGESTING', 5200, { sub: 'HOLDING', why: 'demo — staged' }],
  ['RETREAT', 5000, { sub: '', why: 'demo — staged' }],
];
function demoStep() {
  const [posture, ms, opts] = DEMO_SEQ[demoIdx % DEMO_SEQ.length];
  demoTarget = (posture === 'STALKING' || posture === 'STRIKE') ? 'SOL' : null;
  applyPosture(posture, opts);
  demoIdx++;
  demoTimer = setTimeout(demoStep, ms);
}
function setDemo(on) {
  demo = on;
  body.classList.toggle('demo', on);
  clearTimeout(demoTimer); demoTimer = null; demoTarget = null; demoIdx = 0;
  $('#card').classList.remove('open');
  if (on) { syncOrbit(majorsFallback(), null); demoStep(); } // staged tour uses the majors
  else if (lastStatus) { renderStatus(lastStatus); poll(); } // true state, immediately
  else poll();
}
/* UI-1: WATCHING is tappable — a single tap opens the Hunt drawer (what
   Serpent is watching, not what to buy). The triple-tap demo toggle stays:
   the drawer only opens once it's clear no more taps are coming. */
let taps = [];
let huntTapTimer = null;
$('#verdict').addEventListener('click', () => {
  const now = Date.now();
  taps = taps.filter((t) => now - t < 650); taps.push(now);
  clearTimeout(huntTapTimer);
  if (taps.length >= 3) { taps = []; setDemo(!demo); return; }
  huntTapTimer = setTimeout(() => { taps = []; if (!demo) openHuntCard(); }, 500);
});
$('#demobadge').addEventListener('click', () => setDemo(false));

/* ---------- reduced motion ---------- */
function setReduced(on) { reduced = on; body.classList.toggle('reduced', on); }
$('#motion').addEventListener('click', () => setReduced(!reduced));

/* ---------- boot ---------- */
function endBoot() { body.classList.remove('booting'); }
$('#boot').addEventListener('click', endBoot);
setTimeout(endBoot, 1900);

/* ---------- main loop ---------- */
buildSerpent();
seedStars();
syncOrbit(majorsFallback(), null); // quiet majors until real attention arrives
setReduced(reduced);
if (demo) setDemo(true);
addEventListener('resize', seedStars);
function frame(t) { drawStars(t); layoutPlanets(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
poll();
setInterval(poll, 2500);
</script>
